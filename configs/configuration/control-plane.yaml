schema_version: 1
profile:
  id: configuration_control_plane
  version: 20.0.0
  status: production_candidate
storage:
  authoritative: postgresql
  development: sqlite
  append_only_versions: true
  content_addressed: true
  optimistic_concurrency: true
  aggregate_head_locking: true
  cross_node_invalidation: true
resolution:
  precedence:
  - request_override
  - shared_game_published
  - room_published
  - user_experiment_published
  - video_profile_published
  - tenant_published
  - environment_published
  - global_published
  - file_bundle_fallback
  require_published_for_runtime: true
  allow_draft_preview: true
  cache_entries: 256
  cache_ttl_seconds: 2.0
  freeze_exact_revision_ids: true
governance:
  publish_requires_scope: baloot.config.admin
  reject_requires_scope: baloot.config.admin
  automatic_production_apply: false
  retain_dissent: true
  audit_hash_chain: true
  maximum_payload_bytes: 1048576
  scheduled_activation: true
  deterministic_rollout: true
lifecycle:
  profile_statuses:
  - draft
  - published
  - rejected
  - retired
  - superseded
  bundle_statuses:
  - draft
  - published
  - rejected
  - retired
  - superseded
  immutable_after_publish: true
  semantic_version_required: true
