schema_version: 1
profile:
  id: rules_certification
  version: 21.0.0
  status: candidate
required_signer_roles:
- certified_referee
- rules_authority
minimum_external_signatures: 2
trusted_signers: []
golden_corpus: examples/rule-fixtures.json
automatic_activation: false
candidate_profile: rules/saudi_common_v1.yaml
adjudication_profile: adjudication/saudi_researched_v1.yaml
software_conformance:
  minimum_executable_fixtures: 250
  minimum_seeded_replay_rounds: 10000
  minimum_python_native_positions: 100000
  minimum_invalid_input_fuzz_cases: 10000
  require_apply_undo_byte_identity: true
  require_observer_noninterference: true
  parity_claim: semantic_equivalence
  external_certification_substitute: false
