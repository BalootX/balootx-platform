metadata:
  meaning: Sampled PIMC with exact values for every legal action in every consistent sampled world; all 32 worlds must complete. Perfect-information cards retain the five-second/ten-million-node limits.
  decisionBudgetJustification: Sun seed 20261025 completed 32 worlds single-threaded in 14.770 wall/14.031 CPU seconds, largest world 9131667 nodes. Forty seconds and 25 million nodes exceed twice these measurements. v1 and v2 remain unchanged.
  calibrationConditions: Windows local_cpu 5 percent, affinity 1 of 24 CPUs; 4 native threads are not 4 physical CPUs. Initial single-thread cohort was 14.770 seconds. Hokum completed in 9.724 seconds before the cache-aging repair.
  latencyTargetSeconds: 2
  latencyTargetStatus: Unmet locally; no four-core p95 claim.
  exactCohortRule: Enumerate all allocations when the constrained upper bound fits maximumSamplingAttempts; otherwise require all 32 distinct sampled worlds. This prevents a tiny late cohort from being mistaken for failed sampling.
  maturity: Local prototype awaiting full-round and volume measurements; incomplete means reject without fallback or no-good.
