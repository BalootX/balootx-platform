    uiExposure: hidden
    observerSafety: referee_restricted
    messageAr: يحفظ النص واقعة تسمية ورقة على أنها الأكبر ولم تكن كذلك، مع حق الخصم في طلب التسجيل بالمشاريع أو الاستمرار؛ ولا يثبت المصطلح المحايد أنها إكّة خاطئة.
    messageEn: The exact row records naming a card as the highest when it was not, with opponent choice to register with projects or continue; the neutral event does not claim a false-Ekka interpretation.
    documentation: docs/ADJUDICATION_RESEARCH_BOUNDARY.md#incorrect-highest-card-naming
