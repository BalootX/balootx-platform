    authorityClass: official_regulation_adjudication
    domainPrimitive: adjudication.external_card_naming
    sourceClause: section_9.registration_table.incorrect_highest_card_naming
    sourceTextAr: أكه بورقة على أنها أكبر ورقة لعب في الجولة ولم تكن كذلك.
    eventScope: external_evidence
    ordinaryTrace: not_an_action
    availableRemedies: [opponent_register_with_projects, continue_play]
