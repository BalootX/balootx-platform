    workflow:
      research_native_delayed_payoff_label: "إثبات فائدة الورقة المتأخرة"
      research_native_delayed_payoff_label_en: "Native delayed-payoff proof"
      research_native_delayed_payoff_scope: "اختياري: يثبت فائدة الورقة الصغيرة أو التضحية الكبيرة بمقارنة مسارين قانونيين حتى نهاية اللفة. متاح لقرار لعب بإثبات تام مع معرفة كل الأوراق فقط، وليس إثباتًا بما يراه اللاعب. هدف الاستمرار هو فارق النقاط المحتسبة. تعطيله يبقي السلوك السابق."
      research_native_delayed_payoff_scope_en: "Optional: compare two legal terminal continuations to prove a low-card payoff or high-card sacrifice. Only exact complete-state play proof is supported, not actor-visible proof. The continuation objective is awarded-point margin. Removing this setting preserves historical behavior."
      research_native_delayed_payoff_metric_label: "وحدة قياس المكسب"
      research_native_delayed_payoff_metric_label_en: "Payoff unit"
      research_native_delayed_payoff_metric_help: "فارق نقاط الورق يقارن مكسب الفريق من الورق فقط، بدون مكافأة الأكلة الأخيرة. فارق النقاط المحتسبة يقارن النتيجة النهائية بعد احتساب المشاريع وقواعد التسجيل. هذه وحدة المكسب التكتيكي؛ هدف الاستمرار يبقى فارق النقاط المحتسبة."
      research_native_delayed_payoff_metric_help_en: "Raw-card margin excludes the last-trick bonus. Awarded margin compares terminal scores including projects and scoring rules. This is the tactical gain unit; continuation optimization still uses awarded-point margin."
      research_native_delayed_payoff_raw: "فارق نقاط الورق"
      research_native_delayed_payoff_raw_en: "Raw-card margin"
      research_native_delayed_payoff_awarded: "فارق النقاط المحتسبة"
      research_native_delayed_payoff_awarded_en: "Awarded-point margin"
      research_native_delayed_payoff_minimum_label: "أقل مكسب مثبت"
      research_native_delayed_payoff_minimum_label_en: "Minimum proven gain"
      research_native_delayed_payoff_minimum_help: "اختر حدًا من ٠ إلى ١٠٠ بوحدة المكسب المختارة؛ لا نختار قيمة نيابةً عنك. مثال: ٢٠ يعني أن المسار المختار أفضل من البديل بعشرين نقطة على الأقل، مع إثبات فائدة لاحقة منفصلة."
      research_native_delayed_payoff_minimum_help_en: "Choose 0–100 in the selected unit; no value is chosen for you. A threshold of 20 requires at least 20 points of improvement over the alternative, plus separately proven later benefit."
