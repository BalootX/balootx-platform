  sections:
    buying:
      title: "الشراء والعقد"
      summary: "المحرك يطبّق جولتين للشراء، ويقيّد الحكم الثاني بنوع غير ورقة الشراء."
      examples:
        - "إذا كانت ورقة الشراء ♠ ومرّت الجولة الأولى، ما تقدر تشتري حكم ♠ في الجولة الثانية."
        - "أشكل يرجع صن، واللي يأخذ اللعب هو شريك صاحب النداء حسب الملف الفعّال."
    card_order:
      title: "قوة الورق والنقاط"
      summary: "ترتيب الحكم يختلف جذريًا عن الصن؛ الولد والتسعة يصيرون أعلى ورقتين في نوع الحكم."
      examples:
        - "في حكم ♠: ولد ♠ يأكل 9♠، و9♠ يأكل آص ♠."
        - "في الصن: الآص أعلى ورقة، وبعده العشرة ثم الشايب."
    escalation:
      title: "التدبيل والقهوة"
      summary: "سلسلة التدبيل والأطراف المؤهلة وحدود الصن تأتي من ملف القواعد نفسه."
      examples:
        - "في الحكم يمكن أن تنتقل السلسلة من دبل إلى ثلاثة ثم أربعة ثم قهوة إذا كانت الأدوار قانونية."
        - "في الصن يسمح الملف الفعّال بالدبل فقط، ويطبّق حد النتيجة قبل فتح القرار."
    legal_play:
      title: "وش تقدر تنزّل؟"
      summary: "القانون يُحسم قبل الذكاء: متابعة النوع، القطع، والتكبير تُفرض عند تحقق شروطها."
      examples:
        - "إذا نزل خصمك ♥ وما عندك ♥، تقطع بالحكم إذا كان خصمك ما زال ماكل وتقدر تقطع."
        - "إذا شريكك ماكل، الاستثناء يعتمد على موقعك وقوة الورقة الحالية؛ ما هو سماح مفتوح دائمًا."
    projects:
      title: "المشاريع وبلوت"
      summary: "اسم المشروع يذكر في الأولى، تُقارن المشاريع بعدها، وينكشف ورق المشروع في دور صاحبه بالثانية."
      examples:
        - "سرا الصن تساوي 4، خمسين 10، ومية 20 نقطة لعب."
        - "بلوت خاص بالحكم، وقيمته نقطتان، وله تعامل مستقل مع تداخل المشاريع."
    scoring:
      title: "الحسبة والكبوت"
      summary: "المحرك وحده يحسب الورق والمشاريع وبلوت والعقد ثم يضيف نتيجة اللفة إلى لنا أو لهم."
      examples:
        - "الفريق المشتري لازم يفوز بالعقد؛ إذا خسر تنتقل نتيجة العقد حسب ملف الحسبة."
        - "الصكّة تنتهي عند تجاوز 152 مع حسم المتصدر، أما التعادل فوق الهدف فيكمّل."
    reading:
      title: "قراءة الورق المخفي"
      summary: "المحرك يسجل الإشارات والسياق والإجبار، لكنه لا يعامل أي حركة كاعتراف مؤكد عن الورق المخفي."
      examples:
        - "صغيرة ثم كبيرة قد تعني تشجيع النوع، وقد تكون اضطرارًا أو تمويهًا؛ لذلك تبقى ترجيحًا لا حقيقة."
        - "ترجيع نوع الشريك يرفع احتمال دعمه، لكن التحليل يبقى على توزيعات قانونية متوافقة مع كل ما ظهر."
    disputed:
      title: "المسائل القابلة للاختلاف"
      summary: "العادات المختلف عليها ليست مخفية داخل الكود؛ الاختيار الفعّال والبدائل محفوظة مع كل لعبة."
      examples:
        - "صاحب أول نزول مضبوط حاليًا على يمين الموزع، ويمكن نشر ملف جديد يختار المشتري بدلًا منه."
        - "كويش وسنين غير مفعّلة افتراضيًا، وأي تفعيل يحتاج ملف قواعد جديد وأدلة تنفيذية."
    authority:
      title: "الإعدادات ما هي شكلية"
      summary: "كل قيمة في ملف القواعد محفوظة ببصمتها: يا إنها تشغّل سلوكًا فعليًا، أو تنرفض بوضوح إذا المحرك ما يدعمها."
      examples:
        - "إذا غيّرت أوزان شراء الصن، قرار الشراء الاحتياطي يتغيّر من نفس الملف بدون رقم مخفي داخل الكود."
        - "إذا حاولت تغيّر ترتيب اللعب إلى وضع غير مدعوم، الملف ينرفض قبل توليد أي لفة."
