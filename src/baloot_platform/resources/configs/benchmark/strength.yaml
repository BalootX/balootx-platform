schema_version: 1
profile:
  id: intelligence_benchmark
  version: 21.2.0
  status: governed_candidate
strata:
- bidding
- opening_lead
- play_obligation
- projects
- midgame
- endgame
- contract_rescue
- risk
- outcome_flip
metrics:
- policy_accuracy
- top3_accuracy
- expected_regret
- brier_score
- expected_calibration_error
- illegal_action_rate
- search_completion
- latency
- memory
- nodes
