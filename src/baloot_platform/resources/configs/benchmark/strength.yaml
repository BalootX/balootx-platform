symmetry:
  seed_start: 41000000
  maximum_cases: 12
  tolerance: 1.0e-09
  required_transforms:
  - seat_rotation
  - team_swap
  - suit_relabel
local_preanalysis:
  minimum_positions: 120
  minimum_policy_accuracy: 0.95
