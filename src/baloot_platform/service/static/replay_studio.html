<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مختبر مراجعة البلوت</title>
  <style>
    :root{color-scheme:dark;--bg:#07110f;--panel:#0c1d19;--panel2:#102720;--line:#24473d;--gold:#e2b65a;--text:#f8f3e7;--muted:#9fb6ae;--good:#68d5a9;--warn:#efc36b;--bad:#ef8277;--accent:#18a77d}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#12362b 0,#07110f 42%,#040907 100%);color:var(--text);font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;min-height:100vh}
    button,input,select,textarea{font:inherit}.shell{max-width:1600px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand h1{font-size:25px;margin:0;color:var(--gold)}.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:8px 12px;border-radius:12px}.nav a.active{color:var(--text);border-color:var(--gold);background:#2c2719}
    .toolbar{display:grid;grid-template-columns:minmax(220px,1fr) auto auto auto;gap:10px;margin-bottom:15px}.field,.select{width:100%;background:#081713;border:1px solid var(--line);border-radius:13px;color:var(--text);padding:11px 13px;outline:none}.field:focus,.select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #e2b65a20}.btn{border:1px solid var(--line);border-radius:13px;background:#17362d;color:var(--text);padding:10px 15px;cursor:pointer}.btn:hover{border-color:var(--gold)}.btn.primary{background:var(--accent);border-color:#2bc99b;color:#04120d;font-weight:700}.btn.gold{background:#4a3c1c;border-color:var(--gold)}.btn.danger{background:#43201f;border-color:#8d4c48}.btn:disabled{opacity:.45;cursor:not-allowed}
    .layout{display:grid;grid-template-columns:290px minmax(430px,1fr) minmax(360px,520px);gap:14px;align-items:start}.panel{background:linear-gradient(180deg,#0d211b,#091713);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 45px #0005}.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-head h2{font-size:16px;margin:0}.panel-body{padding:14px}.games,.decisions{max-height:72vh;overflow:auto}.item{padding:11px;border:1px solid transparent;border-bottom-color:#1a332c;cursor:pointer;border-radius:12px}.item:hover{background:#112b23}.item.active{background:#16382d;border-color:#32775f}.item strong{display:block;font-size:14px}.meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:7px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--muted)}.chip.good{color:var(--good);border-color:#397962}.chip.warn{color:var(--warn);border-color:#84682d}.chip.bad{color:var(--bad);border-color:#824b47}.empty{color:var(--muted);text-align:center;padding:34px 12px}
    .video-wrap{background:#020504;border-bottom:1px solid var(--line);position:relative;display:flex;justify-content:center;min-height:330px}.video-wrap video{max-height:64vh;max-width:100%;background:#000}.video-note{position:absolute;bottom:12px;right:12px;background:#07110fdd;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{border:1px solid var(--line);background:#0a1a16;border-radius:13px;padding:10px}.stat label{display:block;color:var(--muted);font-size:11px}.stat b{display:block;margin-top:4px;font-size:16px}.decision-row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center}.ordinal{width:30px;height:30px;border-radius:9px;background:#16362d;display:grid;place-items:center;color:var(--gold);font-weight:700}.quality{font-size:11px;padding:4px 7px;border-radius:999px;background:#172923;color:var(--muted)}
    .audit-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.audit-title h3{margin:0;font-size:18px}.action{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#071612;border:1px solid var(--line);border-radius:10px;padding:6px 9px;display:inline-block}.compare{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.compare-card{border:1px solid var(--line);border-radius:14px;padding:11px;background:#0a1b16}.compare-card.best{border-color:#4cae8a;background:#0d271f}.compare-card small{color:var(--muted);display:block}.compare-card strong{display:block;margin-top:5px}.reason{padding:10px 0;border-bottom:1px solid #1b352d}.reason:last-child{border:0}.reason strong{display:block}.reason p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.65}.section-title{font-size:13px;color:var(--gold);margin:16px 0 7px}.alternatives{display:flex;flex-direction:column;gap:7px}.alt{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:#0a1a16;border:1px solid var(--line);border-radius:12px;padding:9px}.alt.best{border-color:#38856b}.alt small{color:var(--muted)}.facts{display:flex;gap:7px;flex-wrap:wrap}.fact{border:1px solid var(--line);border-radius:10px;padding:7px 9px;color:var(--muted);font-size:12px}.intent{border-right:3px solid var(--gold);padding:9px 11px;background:#181b12;border-radius:10px;color:var(--muted);line-height:1.6}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form-grid textarea{grid-column:1/-1;min-height:80px;resize:vertical;background:#081713;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px}.status{position:fixed;left:18px;bottom:18px;max-width:420px;background:#06110edb;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:13px;padding:10px 14px;color:var(--muted);z-index:9;display:none}.status.show{display:block}.advanced summary{cursor:pointer;color:var(--muted);margin-top:14px}.advanced pre{white-space:pre-wrap;word-break:break-word;background:#050d0b;border:1px solid var(--line);padding:10px;border-radius:10px;direction:ltr;text-align:left;font-size:11px;max-height:260px;overflow:auto}
    @media(max-width:1180px){.layout{grid-template-columns:250px 1fr}.analysis-panel{grid-column:1/-1}.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.shell{padding:10px}.top{align-items:flex-start;flex-direction:column}.toolbar{grid-template-columns:1fr 1fr}.toolbar .field{grid-column:1/-1}.layout{grid-template-columns:1fr}.games{max-height:260px}.summary{grid-template-columns:1fr 1fr}.compare{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.video-wrap video{max-height:70vh}}
  </style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><h1>مختبر مراجعة البلوت</h1><p>إعادة اللعبة، تفسير كل قرار، مقارنة البدائل، وضبط الصعوبة والتعلّم.</p></div>
    <nav class="nav"><a href="/studio">الإعدادات</a><a href="/learn">التعلّم</a><a href="/challenges">التحديات</a><a class="active" href="/replay">المراجعة</a></nav>
  </header>
  <div class="toolbar">
    <input id="search" class="field" placeholder="ابحث برقم اللعبة أو الهاش أو الوصف">
    <button id="refresh" class="btn">تحديث</button>
    <button id="auditGame" class="btn gold" disabled>حلّل اللعبة</button><button id="renderGame" class="btn primary" disabled>فيديو مراجعة كامل</button>
  </div>
  <main class="layout">
    <section class="panel">
      <div class="panel-head"><h2>سجل الألعاب</h2><span id="gameCount" class="chip">٠</span></div>
      <div id="games" class="games"><div class="empty">جارٍ تحميل الألعاب…</div></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2 id="gameTitle">اختر لعبة</h2><span id="verified" class="chip">—</span></div>
      <div class="video-wrap"><video id="video" controls playsinline></video><div id="videoNote" class="video-note">لا يوجد فيديو مرتبط</div></div>
      <div class="panel-body">
        <div id="summary" class="summary"></div>
        <div class="panel-head" style="margin:0 -14px 8px"><h2>قرارات اللعبة</h2><span id="decisionCount" class="chip">٠</span></div>
        <div id="decisions" class="decisions"><div class="empty">اختر لعبة لعرض القرارات.</div></div>
      </div>
    </section>
    <section class="panel analysis-panel">
      <div class="panel-head"><h2>تحليل القرار</h2><button id="reanalyze" class="btn" disabled>إعادة التحليل</button></div>
      <div id="analysis" class="panel-body"><div class="empty">اختر قراراً لمراجعة سبب اللعب والبدائل.</div></div>
    </section>
  </main>
</div>
<div id="status" class="status"></div>
<script>
const $=id=>document.getElementById(id);let games=[],pkg=null,currentDecision=null,currentAudit=null,currentVideo=null;
const arNum=v=>String(v??'—').replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(text,bad=false){const e=$('status');e.textContent=text;e.style.borderColor=bad?'#824b47':'#24473d';e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3200)}
async function api(url,opt={}){const r=await fetch(url,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||`HTTP ${r.status}`);return d}
function actionText(a){if(!a)return '—';if(a.kind==='card')return a.code||`${a.rank||''} ${a.suit||''}`;if(a.kind==='bid')return `${a.action||'pass'}${a.trumpSuit?' · '+a.trumpSuit:''}`;if(a.card)return actionText(a.card);if(a.action)return `${a.action}${a.trumpSuit?' · '+a.trumpSuit:''}`;if(a.code)return a.code;return a.value??JSON.stringify(a)}
function qClass(q){return q==='excellent'||q==='good'?'good':q==='mistake'||q==='blunder'?'bad':'warn'}
function qAr(q){return ({forced:'إجباري',excellent:'ممتاز',good:'جيد',inaccuracy:'غير دقيق',mistake:'خطأ',blunder:'خطأ حاسم'})[q]||q||'غير محلل'}
async function loadGames(){try{const d=await api('/api/v1/history/games?limit=250&search='+encodeURIComponent($('search').value));games=d.games||[];renderGames()}catch(e){toast(e.message,true)}}
function renderGames(){const box=$('games');$('gameCount').textContent=arNum(games.length);box.innerHTML=games.length?games.map(g=>`<div class="item" data-id="${esc(g.gameHash||g.gameId)}"><strong>${esc(g.serial||g.gameId)}</strong><div class="meta"><span>${esc(g.status||'')}</span><span>${esc(g.contract||'')}</span><span>${esc((g.createdAt||'').slice(0,16).replace('T',' '))}</span></div></div>`).join(''):'<div class="empty">لا توجد ألعاب محفوظة بعد.</div>';box.querySelectorAll('.item').forEach(x=>x.onclick=()=>selectGame(x.dataset.id,x))}
async function selectGame(id,node){document.querySelectorAll('#games .item').forEach(x=>x.classList.remove('active'));node?.classList.add('active');$('analysis').innerHTML='<div class="empty">اختر قراراً لمراجعته.</div>';currentDecision=currentAudit=null;try{pkg=await api(`/api/v1/history/games/${encodeURIComponent(id)}/replay`);renderPackage()}catch(e){toast(e.message,true)}}
function stat(label,value){return `<div class="stat"><label>${label}</label><b>${esc(value??'—')}</b></div>`}
function renderPackage(){const g=pkg.game||{};$('gameTitle').textContent=g.serial||g.gameId;$('verified').textContent=pkg.verification?.valid?'✓ موثّقة':'بحاجة تحقق';$('verified').className='chip '+(pkg.verification?.valid?'good':'bad');$('auditGame').disabled=false;$('renderGame').disabled=false;$('summary').innerHTML=stat('العقد',g.contract||'—')+stat('المشتري',g.buyer||'—')+stat('الجولة',arNum(g.roundNumber||1))+stat('النتيجة',`${arNum((g.matchScore||[])[0]||0)} — ${arNum((g.matchScore||[])[1]||0)}`);const vids=pkg.videos||[];currentVideo=vids[0]||null;const url=currentVideo?.manifest?.urls?.video;$('video').src=url||'';$('videoNote').textContent=url?`فيديو موثّق · ${currentVideo.videoId}`:'لا يوجد فيديو مرتبط';renderDecisions()}
function timeForDecision(id){const timeline=currentVideo?.timeline||currentVideo?.manifest?.timelineIndex||[];const hit=timeline.find(x=>x.decisionId===id);return hit?Number(hit.startSeconds||0):null}
function renderDecisions(){const ds=pkg.decisions||[];$('decisionCount').textContent=arNum(ds.length);$('decisions').innerHTML=ds.length?ds.map(d=>{const audit=(d.audits||[])[0];return `<div class="item" data-id="${esc(d.decisionId)}"><div class="decision-row"><span class="ordinal">${arNum(d.ordinal)}</span><div><strong>${d.decisionKind==='bid'?'شراء':'لعب'} · ${esc(d.actor)}</strong><div class="meta"><span>${esc(actionText(d.selectedAction))}</span><span>${timeForDecision(d.decisionId)!==null?'▶ '+arNum(timeForDecision(d.decisionId).toFixed(1))+'ث':''}</span></div></div><span class="quality ${qClass(audit?.qualityLabel)}">${qAr(audit?.qualityLabel)}</span></div></div>`}).join(''):'<div class="empty">لا توجد قرارات مسجلة.</div>';$('decisions').querySelectorAll('.item').forEach(x=>x.onclick=()=>selectDecision(x.dataset.id,x))}
async function selectDecision(id,node){document.querySelectorAll('#decisions .item').forEach(x=>x.classList.remove('active'));node?.classList.add('active');currentDecision=(pkg.decisions||[]).find(x=>x.decisionId===id);$('reanalyze').disabled=false;const t=timeForDecision(id);if(t!==null&&$('video').src){$('video').currentTime=t;$('video').play().catch(()=>{})}try{const existing=(currentDecision?.audits||[])[0];currentAudit=existing||await api(`/api/v1/history/decisions/${encodeURIComponent(id)}:explain`,{method:'POST',body:JSON.stringify({samples:48,exactAllocationLimit:10000,exactSearchRemaining:9})});renderAudit()}catch(e){toast(e.message,true);renderDecisionOnly()}}
function renderDecisionOnly(){$('analysis').innerHTML=`<div class="audit-title"><h3>${esc(actionText(currentDecision?.selectedAction))}</h3></div><p class="intent">لم يكتمل التحليل بعد. اضغط إعادة التحليل.</p>`}
function renderAudit(){const a=currentAudit||{};const intent=a.actualIntent||{};const reasons=a.reasons||[];const alts=a.alternatives||[];const diff=(currentDecision?.difficulty||{});$('analysis').innerHTML=`
<div class="audit-title"><div><h3>${currentDecision?.decisionKind==='bid'?'قرار شراء':'قرار لعب'} رقم ${arNum(currentDecision?.ordinal)}</h3><div class="meta"><span>${esc(currentDecision?.actor)}</span><span>${esc(a.engineMethod||'')}</span></div></div><span class="chip ${qClass(a.qualityLabel)}">${qAr(a.qualityLabel)} · ${arNum(Math.round(a.qualityScore||0))}٪</span></div>
<div class="compare"><div class="compare-card"><small>اللعب الفعلي</small><strong>${esc(actionText(a.actualAction))}</strong><div class="meta">الترتيب ${arNum(a.selectedRank||'—')}</div></div><div class="compare-card best"><small>أفضل بديل حسب التحليل</small><strong>${esc(actionText(a.bestAction))}</strong><div class="meta">نزول الفوز ${arNum(((a.winProbabilityDrop||0)*100).toFixed(1))}٪</div></div></div>
<div class="intent"><b>ما نعرفه عن النية:</b> ${esc(intent.summaryAr||intent.status||'نية اللاعب البشري غير معروفة ما لم يكتب سبب اختياره.')}</div>
<div class="section-title">لماذا؟</div>${reasons.length?reasons.map(r=>`<div class="reason"><strong>${esc(r.titleAr||r.code)}</strong><p>${esc(r.detailAr||'')}</p></div>`).join(''):'<div class="empty">لا توجد أسباب إضافية.</div>'}
<div class="section-title">البدائل</div><div class="alternatives">${alts.map(x=>`<div class="alt ${x.rank===1?'best':''}"><b>${esc(actionText(x.action))}</b><small>فوز ${arNum((Number(x.winProbability||0)*100).toFixed(1))}٪</small><small>ندم ${arNum(Number(x.regret||0).toFixed(1))}</small></div>`).join('')}</div>
<div class="section-title">حقائق واستنتاجات</div><div class="facts">${(a.hardFacts||[]).slice(0,8).map(x=>`<span class="fact">✓ ${esc(x.descriptionAr||x.kind||x.code||'حقيقة قانونية')}</span>`).join('')}${(a.signalHypotheses||[]).slice(0,5).map(x=>`<span class="fact">؟ ${esc(x.descriptionAr||x.kind||x.pattern||'فرضية لعب')}</span>`).join('')}</div>
<div class="section-title">الصعوبة المتعلّمة</div><div class="compare"><div class="compare-card"><small>تقدير المحرك</small><strong>${arNum(Math.round(a.predictedDifficulty||0))}٪</strong></div><div class="compare-card best"><small>معايرة الجمهور</small><strong>${diff.calibratedDifficulty!==undefined?arNum(Math.round(diff.calibratedDifficulty))+'٪':'تحتاج إجابات أكثر'}</strong></div></div>
<div class="section-title">جرّب وعدّل</div><div class="form-grid"><input id="player" class="field" placeholder="معرّف اللاعب (اختياري)"><input id="seconds" class="field" type="number" min="0" placeholder="وقت القرار بالثواني"><select id="choice" class="select">${alts.map(x=>`<option value='${esc(JSON.stringify(x.action))}'>${esc(actionText(x.action))}</option>`).join('')}</select><select id="confidence" class="select"><option value="0.6">ثقة متوسطة</option><option value="0.85">ثقة عالية</option><option value="1">ثقة كاملة</option></select><textarea id="rationale" placeholder="اكتب سببك أو ملاحظة الخبير…"></textarea><button id="submitAttempt" class="btn primary">سجّل الإجابة</button><button id="submitFeedback" class="btn gold">اعتماد تصحيح خبير</button><button id="forkDecision" class="btn">أنشئ فرع ماذا لو</button><button id="compareVersions" class="btn">قارن التحليلات</button></div><div id="branchResult" class="meta" style="margin-top:9px"></div>
<details class="advanced"><summary>تفاصيل المطورين والتدقيق</summary><pre>${esc(JSON.stringify(a,null,2))}</pre></details>`;
$('choice').value=JSON.stringify(a.actualAction);$('submitAttempt').onclick=submitAttempt;$('submitFeedback').onclick=submitFeedback;$('forkDecision').onclick=forkDecision;$('compareVersions').onclick=compareVersions}

async function forkDecision(){try{const chosen=JSON.parse($('choice').value);const d=await api(`/api/v1/history/decisions/${currentDecision.decisionId}:fork`,{method:'POST',body:JSON.stringify({action:chosen,continueToEnd:true,maximumActions:256})});$('branchResult').textContent=`تم إنشاء فرع: ${d.gameId||d.branchGameId||'جديد'} — يمكنك فتحه من سجل الألعاب.`;toast('تم إنشاء مسار ماذا لو مع حفظ الأصل.')}catch(e){toast(e.message,true)}}
async function compareVersions(){try{const d=await api(`/api/v1/history/decisions/${currentDecision.decisionId}/comparison`);const c=d.changed||{};$('branchResult').textContent=d.previous?`تغيّر أفضل قرار: ${c.bestAction?'نعم':'لا'} · فرق الندم ${Number(c.regretDelta||0).toFixed(2)} · تغيّر نسخة المحرك: ${c.engineVersionChanged?'نعم':'لا'}`:'لا يوجد تحليل أقدم للمقارنة بعد.';}catch(e){toast(e.message,true)}}
async function renderHistoricalVideo(){if(!pkg)return;try{const b=$('renderGame');b.disabled=true;b.textContent='جارٍ تجهيز الفيديو…';const id=pkg.game.gameHash||pkg.game.gameId;const created=await api(`/api/v1/history/games/${encodeURIComponent(id)}/video-jobs`,{method:'POST',body:JSON.stringify({decisionId:currentDecision?.decisionId||null,rendererPlugin:'premium_video',theme:'emerald',width:1080,height:1920,fps:60,crf:18,auditSamples:48})});for(let i=0;i<720;i++){await new Promise(r=>setTimeout(r,750));const job=await api(`/api/v1/jobs/${created.jobId}`);b.textContent=`الفيديو ${Math.round((job.progress||0)*100)}٪`;if(job.status==='completed'){pkg=await api(`/api/v1/history/games/${encodeURIComponent(id)}/replay`);renderPackage();const url=job.result?.video;if(url){$('video').src=url;$('video').play().catch(()=>{})}toast('اكتمل فيديو المراجعة التاريخية وربط كل قرار بوقته.');return}if(job.status==='failed'||job.status==='cancelled')throw new Error(job.error||'تعذر إنشاء الفيديو')}throw new Error('انتهت مهلة انتظار الفيديو')}catch(e){toast(e.message,true)}finally{const b=$('renderGame');b.disabled=false;b.textContent='فيديو مراجعة كامل'}}
async function submitAttempt(){try{const chosen=JSON.parse($('choice').value);const d=await api(`/api/v1/history/decisions/${currentDecision.decisionId}/attempts`,{method:'POST',body:JSON.stringify({playerId:$('player').value||null,chosenAction:chosen,responseSeconds:$('seconds').value?Number($('seconds').value):null,confidence:Number($('confidence').value),changedAnswer:false})});toast(d.accepted?'إجابة مقبولة وسُجلت للمعايرة.':'سُجلت الإجابة لتحديث مستوى الصعوبة.');}catch(e){toast(e.message,true)}}
async function submitFeedback(){try{const chosen=JSON.parse($('choice').value);await api(`/api/v1/history/decisions/${currentDecision.decisionId}/feedback`,{method:'POST',body:JSON.stringify({preferredAction:chosen,confidence:Number($('confidence').value),rationale:$('rationale').value,source:'expert',reviewer:$('player').value||null})});toast('تم حفظ تصحيح الخبير في سجل غير قابل للتعديل.');}catch(e){toast(e.message,true)}}
$('refresh').onclick=loadGames;$('renderGame').onclick=renderHistoricalVideo;$('search').onkeydown=e=>{if(e.key==='Enter')loadGames()};$('auditGame').onclick=async()=>{if(!pkg)return;try{$('auditGame').disabled=true;toast('جارٍ تحليل قرارات اللعبة…');const id=pkg.game.gameHash||pkg.game.gameId;await api(`/api/v1/history/games/${encodeURIComponent(id)}:audit`,{method:'POST',body:JSON.stringify({mode:'observer_safe',maximumDecisions:64,samples:32,exactAllocationLimit:8000,exactSearchRemaining:8})});pkg=await api(`/api/v1/history/games/${encodeURIComponent(id)}/replay`);renderPackage();toast('اكتمل تحليل اللعبة.')}catch(e){toast(e.message,true)}finally{$('auditGame').disabled=false}};$('reanalyze').onclick=async()=>{if(!currentDecision)return;try{$('reanalyze').disabled=true;currentAudit=await api(`/api/v1/history/decisions/${currentDecision.decisionId}:explain`,{method:'POST',body:JSON.stringify({rerun:true,samples:96,exactAllocationLimit:20000,exactSearchRemaining:10})});renderAudit();toast('أعيد التحليل بأحدث المحرك.')}catch(e){toast(e.message,true)}finally{$('reanalyze').disabled=false}};
loadGames();
</script>
</body>
