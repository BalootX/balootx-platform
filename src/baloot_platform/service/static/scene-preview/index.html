<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061713">
  <link rel="icon" href="data:,">
  <title data-copy-key="page_title"></title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div id="brand" class="brand"><span class="brand-mark" data-copy-key="brand_mark"></span><strong data-copy-key="brand_name"></strong></div>
      <nav id="artifact" class="export-switcher">
        <button type="button" data-artifact="flagship" data-copy-key="flagship_label" aria-pressed="true"></button>
        <button type="button" data-artifact="hitl" data-copy-key="decision_label" aria-pressed="false"></button>
      </nav>
    </header>

    <section id="viewer" class="viewer">
      <div class="video-stage" id="phone">
        <video id="video" controls playsinline preload="metadata">
          <track id="captionsTrack" kind="captions" srclang="ar">
        </video>
        <img id="still" alt="" hidden>
        <div class="safe-area" aria-hidden="true"></div>
      </div>

      <div class="viewer-meta">
        <div>
          <span id="formatLabel" class="format-label"></span>
          <h1 id="title"></h1>
        </div>
        <div id="utility-controls" class="utility-controls">
          <label><span data-copy-key="speed_label"></span><select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
          <button id="captions" type="button" data-copy-key="captions_button" aria-pressed="false"></button>
          <button id="fullscreen" type="button" data-copy-key="fullscreen"></button>
        </div>
      </div>

      <nav id="chapters" class="chapters"></nav>
    </section>

    <details class="qa-drawer">
      <summary data-copy-key="qa_summary"></summary>
      <div class="qa-grid">
        <label><span data-copy-key="scene_label"></span><select id="scene"></select></label>
        <button id="safeArea" type="button" data-copy-key="safe_area" aria-pressed="false"></button>
        <button id="disclosure" type="button" data-copy-key="disclosure" aria-pressed="false"></button>
        <div class="fact"><span data-copy-key="resolution"></span><strong id="resolution"></strong></div>
        <div class="fact"><span data-copy-key="identity"></span><strong id="identity" dir="ltr"></strong></div>
        <div id="layers" class="layers" hidden><ul id="layerList"></ul></div>
      </div>
    </details>
  </main>
  <script src="qa-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
