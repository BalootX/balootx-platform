version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directories:
      - /src/baloot_platform/service/foundry_dashboard
      - /src/baloot_platform/video/remotion
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directories:
      - /
      - /ci
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
