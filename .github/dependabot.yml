version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /src/baloot_platform/service/foundry_dashboard
      - /src/baloot_platform/video/remotion
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        # TypeScript majors change the compiler API; review them in their own PR.
        exclude-patterns: ["typescript"]
  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
