name: RC4 encoder isolation
on:
  push:
    branches: [fix/render-determinism-20261120]
permissions:
  actions: read
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    env:
      SOURCE_DATE_EPOCH: '315532800'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Download historical input bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 44688906370 -R "$GITHUB_REPOSITORY" --name media-bundles --dir outputs/professional-video-prototypes
      - name: Compare CPU paths on one captured frame sequence
        working-directory: src/baloot_platform/video/remotion
        run: |
          npm ci --no-audit --no-fund
          cat >scripts/rc4-probe.mjs <<'JS'
          import {execFileSync} from "node:child_process";
          import {createHash} from "node:crypto";
          import {readFileSync, readdirSync} from "node:fs";
          import {dirname, join} from "node:path";
          import {createRequire} from "node:module";
          import {bt709FfmpegOverride} from "./ffmpeg-profile.mjs";

          const require = createRequire(import.meta.url);
          const {dir} = require("@remotion/compositor-linux-x64-gnu");
          const digest = data => createHash("sha256").update(data).digest("hex");
          export function probe(override) {
            const args = bt709FfmpegOverride(override);
            if (!args.at(-1).endsWith("card-motion-reduced.mp4")) return args;
            const imageDir = dirname(args[args.indexOf("-i") + 1]);
            const captures = readdirSync(imageDir).sort().filter(name => /\.jpe?g$/.test(name));
            if (captures.length !== 120) throw new Error(`Expected 120 capture files, got ${captures.length}`);
            const hashes = captures.map(name => digest(readFileSync(join(imageDir, name))));
            console.log("CAPTURE", captures.length, hashes[0], digest(hashes.join("\n")));
            for (const [label, flags] of [
              ["default", ""], ["scalar", ":asm=0"],
              ["independent", ":cpu-independent=1"], ["independent-scalar", ":cpu-independent=1:asm=0"],
            ]) {
              const command = [...args];
              command[args.indexOf("-x264-params") + 1] += flags;
              const output = join(process.env.RUNNER_TEMP, `${label}.mp4`);
              command[command.length - 1] = output;
              const stderr = execFileSync("bash", ["-c", 'exec "$@" 2>&1', "ffmpeg", join(dir, "ffmpeg"), ...command], {
                cwd: dir, env: {...process.env, LD_LIBRARY_PATH: dir}, encoding: "utf8", timeout: 60_000,
              });
              console.log("ENCODE", label, digest(readFileSync(output)), stderr.split("\n").find(line => line.includes("using cpu capabilities")));
            }
            return args;
          }
          JS
          sed -i 's/import {bt709FfmpegOverride} from ".\/ffmpeg-profile.mjs";/import {probe as bt709FfmpegOverride} from ".\/rc4-probe.mjs";/' scripts/render-prototypes.mjs
          cpus="$(python -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:4])))')"
          taskset --cpu-list "$cpus" node scripts/render-prototypes.mjs
