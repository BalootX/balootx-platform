name: Nightly synthetic candidates

on:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: read

jobs:
  nightly-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src:.
      SOURCE_DATE_EPOCH: '315532800'
      BALOOT_RENDER_TIMEOUT_SECONDS: '300'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-remotion-${{ hashFiles('src/baloot_platform/video/remotion/package-lock.json') }}
      - name: Install the locked Remotion dependencies
        working-directory: src/baloot_platform/video/remotion
        run: npm ci --ignore-scripts --no-audit --no-fund
      - id: ffmpeg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-debs
          key: ${{ runner.os }}-${{ runner.arch }}-ffmpeg-6.1.1-3ubuntu5-${{ hashFiles('.github/ffmpeg/noble-amd64.sha256') }}
      - name: Install the pinned media tools
        env:
          CACHE_HIT: ${{ steps.ffmpeg-cache.outputs.cache-hit }}
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg-debs"
          cd "$RUNNER_TEMP/ffmpeg-debs"
          lock="$GITHUB_WORKSPACE/.github/ffmpeg/noble-amd64.sha256"
          if [[ "$CACHE_HIT" != 'true' ]]; then
            xargs -r -P 4 -n 2 bash -euo pipefail -c '
              mkdir -p "$(dirname "$2")"
              curl --fail --silent --show-error --location --connect-timeout 5 --max-time 25 --output "$2" \
                "https://snapshot.ubuntu.com/ubuntu/20261120T000000Z/$2" || exit 255
            ' bash < "$lock"
          fi
          sha256sum --check --strict "$lock"
          mapfile -t packages < <(awk '{print "./" $2}' "$lock")
          sudo env DEBIAN_FRONTEND=noninteractive dpkg --skip-same-version --install "${packages[@]}"
      - name: Build the native exact solver
        run: |
          python -m pip install .
          cmake -S native -B build/native-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-release --target baloot_native
      - name: Generate and qualify synthetic candidates
        id: qualify
        run: |
          python -B -P scripts/nightly_candidates.py \
            --run-id "$GITHUB_RUN_ID" --source "$GITHUB_SHA" \
            --native-library build/native-release/libbaloot_native.so \
            --rounds 96 --target 4 --out "$RUNNER_TEMP/nightly-candidates"
      - name: Retain the candidate index and evidence
        if: ${{ !cancelled() && steps.qualify.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-synthetic-candidates
          path: ${{ runner.temp }}/nightly-candidates/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
