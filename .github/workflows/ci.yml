name: ci

on:
  workflow_dispatch:
    inputs:
      viewer-seat-proof:
        description: Run the viewer-seat proof cohort
        type: boolean
        default: false
      qa-journey:
        description: Run one synthetic QA journey
        type: choice
        default: 'none'
        options:
          - 'none'
          - foundry
          - api-sdk
          - replay-adjudication
          - clip-render-bundle
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Keep one group per PR and a unique group per push, dispatch or merge queue run.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name != 'pull_request' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_RETRIES: '2'
  PIP_TIMEOUT: '30'
  NPM_CONFIG_FETCH_RETRIES: '2'
  NPM_CONFIG_FETCH_TIMEOUT: '40000'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'
  PYTHONPATH: src

jobs:
  plan:
    if: >-
      ${{ !inputs.viewer-seat-proof && (!inputs.qa-journey || inputs.qa-journey == 'none') &&
          (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      sdk: ${{ steps.plan.outputs.sdk }}
      foundry: ${{ steps.plan.outputs.foundry }}
      remotion: ${{ steps.plan.outputs.remotion }}
      video_worker: ${{ steps.plan.outputs.video_worker }}
      docker_constraints: ${{ steps.plan.outputs.docker_constraints }}
      tests: ${{ steps.plan.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: plan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 -P scripts/ci_scope.py plan

  preflight:
    if: ${{ !inputs.viewer-seat-proof && (!inputs.qa-journey || inputs.qa-journey == 'none') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check pull request opener
        if: github.event_name == 'pull_request'
        env:
          # GitHub account IDs for tree-publisher and Dependabot.
          ALLOWED_PR_OPENER_IDS: '357558349 49699333'
          PR_OPENER_ID: ${{ github.event.pull_request.user.id }}
          PR_OPENER_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          python3 -I -c '
          import os

          if (
              os.environ["PR_OPENER_TYPE"] != "Bot"
              or os.environ["PR_OPENER_ID"] not in os.environ["ALLOWED_PR_OPENER_IDS"].split()
          ):
              raise SystemExit("::error::Open this pull request through an approved GitHub App.")
          '
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &py313
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest>=8.3' 'PyYAML>=6.0' 'ruff>=0.11' 'jsonschema>=4.23'
      - run: |
          ruff check --select E9,F63,F7,F82 src scripts sdk/python tests ci/critical_review.py ci/commit_screen.py
          python -m compileall -q src scripts sdk/python
          python -m pytest -q tests/test_ci_hosted_contract.py tests/test_repository_structure.py tests/test_media_render_artifact.py

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - *checkout
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

  python-version-smoke:
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: |
          python -m pip install '.[dev,grpc,security]'
          python -m compileall -q src scripts sdk/python
          python -m pytest -q tests/test_mcp_builtin.py

  docker-constraints:
    # Keep both jobs inside the full-profile capacity cap.
    needs: [plan, commit-screen]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.docker_constraints == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - *checkout
      - run: docker build --progress=plain --target docker-constraints .

  postgres-configuration:
    # Reuse the runner slot after the identity proof to stay within hosted capacity.
    needs: [plan, identity-postgres]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: baloot_test
          POSTGRES_DB: baloot_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: --health-cmd "pg_isready -U baloot_test -d baloot_test" --health-interval 2s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - *py313
      - run: python -m pip install '.[dev,grpc,postgres]'
      - name: Verify migration, store behavior and previous-release compatibility
        env:
          BALOOT_TEST_POSTGRES_URL: postgresql://baloot_test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/baloot_test
          PREVIOUS_RELEASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          previous_ref="${PREVIOUS_RELEASE:-HEAD^1}"
          if ! git cat-file -e "${previous_ref}^{commit}"; then
            git fetch --no-tags --depth=1 origin "$previous_ref"
          fi
          previous_root="$RUNNER_TEMP/previous-release"
          git worktree add --detach "$previous_root" "$previous_ref"
          export BALOOT_PREVIOUS_ROOT="$previous_root"
          suite=tests/postgres_configuration_schedule.py
          sqlite_startup="${suite}::test_runtime_boot_and_recovery_across_scheduled_handoff[sqlite]"
          # The isolated SQLite startup proof does not use the PostgreSQL fixture.
          python -m pytest -q -s "$suite" --deselect "$sqlite_startup" &
          configuration_pid=$!
          status=0
          python -m pytest -q -s "$sqlite_startup" || status=$?
          wait "$configuration_pid" || status=$?
          exit "$status"

  identity-postgres:
    needs: [plan, preflight]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - *checkout
      - *py313
      - run: python -m pip install -c requirements-docker.txt '.[dev,postgres]'
      - name: Verify paging and migration replay against PostgreSQL
        run: |
          image="$(python -c 'from scripts.verify_live_postgres_research import POSTGRES_IMAGE_TAG, EXPECTED_POSTGRES_INDEX_DIGEST; print(f"{POSTGRES_IMAGE_TAG}@{EXPECTED_POSTGRES_INDEX_DIGEST}")')"
          container="$(docker run --rm --detach --publish 127.0.0.1::5432 \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e 'POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C --locale-provider=icu --icu-locale=en-US' \
            "$image")"
          trap 'docker rm --force "$container"' EXIT
          if ! timeout 30s bash -c 'until docker exec "$1" pg_isready -q -h 127.0.0.1 -U postgres; do sleep 1; done' -- "$container"; then
            docker logs "$container"
            exit 1
          fi
          endpoint="$(docker port "$container" 5432/tcp)"
          export BALOOT_IDENTITY_TEST_POSTGRES="dbname=postgres host=127.0.0.1 port=${endpoint##*:} user=postgres connect_timeout=5"
          python -m pytest -s tests/test_v8_identity_sakka.py -k identity_pagination_large_lists_and_plans

  foundry:
    needs: [plan, python-wheelhouse]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.foundry == 'true' &&
      (needs.python-wheelhouse.result == 'success' ||
       (needs.plan.outputs.full == 'false' && needs.python-wheelhouse.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/baloot_platform/service/foundry_dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - &foundry-playwright-output
        name: Set the Foundry Playwright output directory
        id: playwright-output
        run: printf 'path=%s/foundry-playwright-output\n' "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
      - *py313
      - &python-runtime-download
        if: needs.plan.outputs.full == 'true'
        uses: &download-artifact actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-runtime-3.13
          path: ${{ runner.temp }}
          digest-mismatch: error
      - &python-runtime-use
        if: needs.plan.outputs.full == 'true'
        name: Activate installed Python runtime
        run: |
          base="$(python -P -c 'import sys; print(sys.base_prefix)')"
          tar -xzf "$RUNNER_TEMP/python-runtime.tar.gz" -C "$RUNNER_TEMP"
          runtime="$RUNNER_TEMP/ci-venv"
          test "$("$runtime/bin/python" -P -c 'import sys; print(sys.base_prefix)')" = "$base"
          test "$("$runtime/bin/python" -P -c 'import sys; print(sys.prefix)')" = "$runtime"
          printf '%s\n' "$runtime/bin" >> "$GITHUB_PATH"
          printf 'VIRTUAL_ENV=%s\n' "$runtime" >> "$GITHUB_ENV"
      - if: needs.plan.outputs.full == 'false'
        working-directory: .
        run: python -m pip install -e '.[dev,grpc,security]'
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - &foundry-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: foundry-cache
        with: &foundry-cache
          path: ~/.npm
          key: ${{ runner.os }}-node22-foundry-${{ hashFiles('src/baloot_platform/service/foundry_dashboard/package-lock.json') }}
      - &foundry-install
        working-directory: src/baloot_platform/service/foundry_dashboard
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.foundry-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *foundry-cache
      - &remotion-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: remotion-cache
        with: &remotion-cache
          path: ~/.npm
          key: ${{ runner.os }}-node22-remotion-${{ hashFiles('src/baloot_platform/video/remotion/package-lock.json') }}
      - &remotion-install
        working-directory: src/baloot_platform/video/remotion
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Foundry Vitest suite
        run: npm run test:research -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/foundry-vitest.xml"
      - if: ${{ !cancelled() }}
        name: Build dashboard for browser tests
        id: foundry-build
        run: npm run build -- --outDir "$RUNNER_TEMP/foundry-dashboard"
      - name: Identify the locked Playwright runtime
        if: ${{ !cancelled() && steps.foundry-build.outcome == 'success' }}
        id: playwright-runtime
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          echo "key=$RUNNER_OS-$RUNNER_ARCH-${ImageVersion:?}-playwright-chromium-v2-$version" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-browsers" >> "$GITHUB_ENV"
      - if: ${{ !cancelled() && steps.playwright-runtime.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with: &playwright-cache
          path: |
            ${{ runner.temp }}/playwright-browsers
            ${{ runner.temp }}/playwright-debs/*.deb
            ${{ runner.temp }}/playwright-debs/inventory.json
          key: ${{ steps.playwright-runtime.outputs.key }}
      - name: Install locked Playwright Chromium
        if: ${{ !cancelled() && steps.playwright-cache.outcome == 'success' }}
        id: playwright-install
        shell: bash
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          inventory="$GITHUB_WORKSPACE/ci/playwright_archive_inventory.py"
          if [[ "$CACHE_HIT" == 'true' ]]; then
            python -I "$inventory" verify "$RUNNER_TEMP/playwright-debs"
            shopt -s nullglob
            packages=("$RUNNER_TEMP"/playwright-debs/*.deb)
            if (( ${#packages[@]} )); then
              # Resolve coupled upgrades before unpacking the restored archives.
              sudo env DEBIAN_FRONTEND=noninteractive apt-get \
                --yes --no-download --no-remove --no-install-recommends \
                -o Dir::Cache::archives="$RUNNER_TEMP/playwright-debs" install "${packages[@]}"
            fi
          else
            mkdir -p "$RUNNER_TEMP/playwright-debs"
            # Capture the packages that the locked installer resolves for this runner image.
            apt_config=$(sudo mktemp /etc/apt/apt.conf.d/99-playwright-archives-XXXXXXXX)
            trap 'sudo rm -- "$apt_config"' EXIT
            printf 'Dir::Cache::archives "%s/playwright-debs";\nAPT::Keep-Downloaded-Packages "true";\n' "$RUNNER_TEMP" |
              sudo tee "$apt_config" > /dev/null
            ./node_modules/.bin/playwright install --with-deps chromium
            python -I "$inventory" seal "$RUNNER_TEMP/playwright-debs"
          fi
          node -e "require('playwright').chromium.launch().then(browser => browser.close())"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *playwright-cache
      - name: Stage the PR base stylesheet for audit screenshots
        if: ${{ github.event_name == 'pull_request' && steps.playwright-install.outcome == 'success' }}
        run: git show HEAD^1:src/baloot_platform/service/foundry_dashboard/src/styles.css > "$RUNNER_TEMP/foundry-audit-base.css"
      - name: Run Foundry Playwright suite
        if: ${{ !cancelled() && steps.playwright-install.outcome == 'success' }}
        id: foundry-playwright
        run: npm run test:operator-e2e -- --reporter=list,junit
        env:
          BALOOT_OPERATOR_E2E_FOUNDRY_DIR: ${{ runner.temp }}/foundry-dashboard
          BALOOT_OPERATOR_E2E_OUTPUT_DIR: ${{ steps.playwright-output.outputs.path }}
          BALOOT_LIVE_RESULT_LATENCY_SAMPLE_OUTPUT: ${{ runner.temp }}/foundry-live-result-latency.json
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ runner.temp }}/foundry-playwright.xml
          BALOOT_FOUNDRY_AUDIT_BASE_CSS: ${{ github.event_name == 'pull_request' && format('{0}/foundry-audit-base.css', runner.temp) || '' }}
      - name: Upload Foundry test receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundry-test-receipts
          path: |
            ${{ runner.temp }}/foundry-vitest.xml
            ${{ runner.temp }}/foundry-playwright.xml
            ${{ runner.temp }}/foundry-live-result-latency.json
            ${{ steps.playwright-output.outputs.path }}/**/audit-*.png
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && job.status == 'success' && format('{0}/**/*.png', steps.playwright-output.outputs.path) || '' }}
          if-no-files-found: error
      - name: Upload Foundry Playwright failure diagnostics
        if: ${{ !cancelled() && steps.foundry-playwright.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundry-playwright-failure-diagnostics
          path: ${{ steps.playwright-output.outputs.path }}
          if-no-files-found: ignore
          retention-days: 7

  sdks:
    needs: plan
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - *checkout
      - *node
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.23'
          cache: false
      - run: npx --yes --package typescript@5.8.3 tsc -p sdk/typescript/tsconfig.json --noEmit
      - run: node --experimental-strip-types --test sdk/typescript/src/client.test.mjs
      - run: go test ./...
        working-directory: sdk/go

  python-wheelhouse:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: &full-python ${{ fromJSON(github.event_name == 'pull_request' && '["3.13"]' || '["3.12","3.13"]') }}
    steps:
      - *checkout
      - &matrix-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with: &pip-cache
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}
      - name: Build wheels and install the run-local Python runtime
        shell: bash
        run: |
          python -P -m pip wheel --wheel-dir "$RUNNER_TEMP/wheelhouse" '.[dev,grpc,security]'
          python -P -m venv "$RUNNER_TEMP/ci-venv"
          # Setuptools leaves source metadata on PYTHONPATH during the wheel build.
          "$RUNNER_TEMP/ci-venv/bin/python" -I -m pip install --no-index "$RUNNER_TEMP"/wheelhouse/*.whl
          "$RUNNER_TEMP/ci-venv/bin/python" -I -c 'from importlib.metadata import version; print(version("baloot-platform"))'
          tar -C "$RUNNER_TEMP" -cf - ci-venv | gzip -1 > "$RUNNER_TEMP/python-runtime.tar.gz"
      - name: Verify OR-Tools in the installed runtime
        run: |
          "$RUNNER_TEMP/ci-venv/bin/python" -I -c 'from ortools.sat.python import cp_model; cp_model.CpModel()'
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *pip-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-runtime-${{ matrix.python }}
          path: ${{ runner.temp }}/python-runtime.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  ffmpeg-packages:
    needs: plan
    if: needs.plan.outputs.full == 'true' || needs.plan.outputs.tests != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - *checkout
      - id: ffmpeg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &ffmpeg-cache
          path: ${{ runner.temp }}/ffmpeg-debs
          key: ${{ runner.os }}-${{ runner.arch }}-ffmpeg-6.1.1-3ubuntu5-${{ hashFiles('.github/ffmpeg/noble-amd64.sha256') }}
      - name: Fetch pinned FFmpeg packages
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg-debs"
          cd "$RUNNER_TEMP/ffmpeg-debs"
          xargs -r -P 4 -n 2 bash -euo pipefail -c '
            mkdir -p "$(dirname "$2")"
            curl --fail --silent --show-error --location --retry 2 --retry-all-errors \
              --retry-delay 1 --connect-timeout 5 --max-time 25 --output "$2" \
              "https://snapshot.ubuntu.com/ubuntu/20261120T000000Z/$2" || exit 255
            printf "%s  %s\n" "$1" "$2" | sha256sum --check --strict || exit 255
          ' bash < "$GITHUB_WORKSPACE/.github/ffmpeg/noble-amd64.sha256"
      - name: Verify pinned FFmpeg cache
        if: steps.ffmpeg-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          cd "$RUNNER_TEMP/ffmpeg-debs"
          sha256sum --check --strict "$GITHUB_WORKSPACE/.github/ffmpeg/noble-amd64.sha256"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *ffmpeg-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-debs-6.1.1-3ubuntu5
          path: ${{ runner.temp }}/ffmpeg-debs
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  native-build:
    needs: plan
    if: needs.plan.outputs.full == 'true' || needs.plan.outputs.tests != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - name: Fingerprint the native toolchain
        id: toolchain
        run: |
          identity="$( { cmake --version; ninja --version; c++ --version; ldd --version; cat /etc/os-release; printf '%s\n' "$GITHUB_WORKSPACE"; } | sha256sum | cut -d ' ' -f 1)"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with: &native-cache
          path: build/native-release
          key: ${{ runner.os }}-${{ runner.arch }}-native-release-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('native/**') }}
      - run: |
          cmake -S native -B build/native-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-release
          ctest --test-dir build/native-release --output-on-failure
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *native-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-release-library
          path: build/native-release/libbaloot_native.so
          if-no-files-found: error
          retention-days: 1

  native-sanitizers:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SANITIZER_BUILD_DIR: build/sanitizer
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address
            extra: ''
          - sanitizer: undefined
            extra: -fno-sanitize-recover=all
    steps:
      - *checkout
      - *py313
      - env:
          SANITIZER: ${{ matrix.sanitizer }}
          EXTRA: ${{ matrix.extra }}
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          asan='detect_leaks=1:halt_on_error=1:abort_on_error=1:disable_coredump=1'
          cmake -S native -B "$SANITIZER_BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_CXX_FLAGS=-fsanitize=$SANITIZER -fno-omit-frame-pointer $EXTRA" \
            "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=$SANITIZER" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=$SANITIZER" \
            "-DBALOOT_ASAN_OPTIONS=$asan"
          cmake --build "$SANITIZER_BUILD_DIR"
          env -u LD_PRELOAD -u ASAN_OPTIONS timeout 180s \
            ctest --test-dir "$SANITIZER_BUILD_DIR" --output-on-failure --timeout 150
      - name: Run ASan verifier pytest nodes
        if: matrix.sanitizer == 'address'
        run: |
          python -m pip install '.[dev]'
          BALOOT_ASAN_BUILD_DIR="$SANITIZER_BUILD_DIR" python -m scripts.run_required_pytest \
            tests/test_v20_asan_verifier_portability.py::test_generated_asan_ctest_invokes_sanitized_binary_without_preload \
            tests/test_v20_asan_verifier_portability.py::test_configured_sanitized_binary_passes_without_preload

  python-windows:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - *py313
      - run: python -m pip install '.[dev,grpc,security]'
      - name: Configure CPU fixture for the hosted checkout
        id: cpu-fixture
        shell: powershell
        run: Copy-Item -LiteralPath ci/windows-ci-local-cpu.json -Destination configs/runtime/local_cpu.json
      - name: Run Windows-only pytest nodes
        shell: powershell
        env:
          WINDOWS_PYTEST_NODES: |
            tests/test_combined_finalist_policy_pilot.py::test_taskkill_failure_still_kills_and_waits_for_the_owned_root[timeout]
            tests/test_combined_finalist_policy_pilot.py::test_taskkill_failure_still_kills_and_waits_for_the_owned_root[nonzero]
            tests/test_combined_finalist_policy_pilot.py::test_atomic_checkpoint_retries_while_a_real_reader_denies_delete
            tests/test_combined_finalist_policy_pilot.py::test_exhausted_checkpoint_retry_removes_the_owned_temporary_file
            tests/test_local_cpu_launcher.py::test_launcher_restores_missing_add_type_temp_directory
            tests/test_local_cpu_launcher.py::test_direct_python_runtime_enforces_cap_once_and_fails_closed[False]
            tests/test_local_cpu_launcher.py::test_direct_python_runtime_enforces_cap_once_and_fails_closed[True]
            tests/test_local_cpu_launcher.py::test_verified_inherited_cpu_ceiling_skips_nested_launcher
            tests/test_local_cpu_launcher.py::test_local_cpu_cap_rejects_invalid_config_and_is_inherited
            tests/test_v18_hitl_governance.py::test_media_command_uses_extended_executable_with_short_argv_zero
            tests/test_verifier_preflight.py::test_archive_node_checks_use_a_bounded_runtime_path
        run: |
          $nodes = @(($env:WINDOWS_PYTEST_NODES -split '\r?\n').Where({ $_ }))
          python -m scripts.run_required_pytest @nodes
      - name: Verify inherited Windows CPU limits through the capped launcher
        if: '!cancelled() && steps.cpu-fixture.outcome == ''success'''
        shell: powershell
        env:
          CAPPED_PYTEST_NODE: tests/test_local_cpu_launcher.py::test_current_capped_process_has_verified_inherited_limits
        run: |
          & ./scripts/run_local_capped.ps1 -Executable (Get-Command python).Source `
            -CommandArguments @('-m', 'scripts.run_required_pytest', $env:CAPPED_PYTEST_NODE)

  python-fast-run:
    needs: [plan, python-wheelhouse, native-build, ffmpeg-packages]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: &fast-timeout 25
    env:
      BALOOT_PYTEST_JOB_MINUTES: *fast-timeout
    strategy:
      fail-fast: false
      matrix:
        python: *full-python
        shard: [1, 2, 3]
    services:
      postgres:
        image: ${{ matrix.python == '3.13' && matrix.shard == 1 && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_DB: oidc_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d oidc_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps: &python-shard
      - &pytest-job-deadline
        name: Set pytest deadline before setup
        shell: bash
        run: |
          # Leave time for process termination and receipt upload.
          echo "BALOOT_PYTEST_DEADLINE=$(( $(date +%s) + BALOOT_PYTEST_JOB_MINUTES * 60 - 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - &merge-group-base
        name: Fetch the trusted merge-group base if missing
        if: github.event_name == 'merge_group'
        shell: bash
        env:
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          [[ "$MERGE_GROUP_BASE" =~ ^[0-9a-f]{40}$ ]]
          if ! git cat-file -e "${MERGE_GROUP_BASE}^{commit}"; then
            git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE"
          fi
      - *matrix-python
      - *node
      - if: github.job == 'python-fast-run'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *foundry-cache
      - if: github.job == 'python-fast-run'
        working-directory: src/baloot_platform/service/foundry_dashboard
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: github.job == 'python-fast-run'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *remotion-cache
      - if: github.job == 'python-fast-run'
        working-directory: src/baloot_platform/video/remotion
        run: npm ci --ignore-scripts --no-audit --no-fund
      - &ffmpeg-download
        name: Download verified FFmpeg packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-debs-6.1.1-3ubuntu5
          path: ${{ runner.temp }}/ffmpeg-debs
          digest-mismatch: error
      - &ffmpeg
        name: Install pinned FFmpeg
        shell: bash
        run: |
          cd "$RUNNER_TEMP/ffmpeg-debs"
          manifest="$GITHUB_WORKSPACE/.github/ffmpeg/noble-amd64.sha256"
          sha256sum --check --strict "$manifest"
          mapfile -t packages < <(awk '{print "./" $2}' "$manifest")
          sudo env DEBIAN_FRONTEND=noninteractive dpkg --skip-same-version --install "${packages[@]}"
          ffmpeg -version
          ffprobe -version
      - uses: *download-artifact
        with:
          name: python-runtime-${{ matrix.python }}
          path: ${{ runner.temp }}
          digest-mismatch: error
      - *python-runtime-use
      - &native-download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-release-library
          path: build/native-release
          digest-mismatch: error
      - name: Check generated contracts
        if: matrix.shard == 1 && github.job == 'python-fast-run'
        run: |
          python -P scripts/sync_package_resources.py
          python -P scripts/generate_openapi.py
          git diff --exit-code -- api/openapi.json
      - name: Verify OIDC migration on PostgreSQL
        if: ${{ !cancelled() && github.job == 'python-fast-run' && matrix.python == '3.13' && matrix.shard == 1 }}
        env:
          BALOOT_TEST_OIDC_POSTGRES_DSN: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/oidc_ci
          BALOOT_TEST_OIDC_LEGACY_REF: 8424ad4302911f7d3d0a193640cae38368c460f1
          BALOOT_TEST_OIDC_PRE_REGISTRY_REF: 92e44d74a0a4d1e8abd8869d1ebf3915ea4948fc
          BALOOT_TEST_OIDC_PRE_CORRECTION_REF: d51efd8e1817322f670fa68d56de06b2a622879b
        run: |
          for ref in "$BALOOT_TEST_OIDC_LEGACY_REF" "$BALOOT_TEST_OIDC_PRE_REGISTRY_REF" "$BALOOT_TEST_OIDC_PRE_CORRECTION_REF"; do
            if ! git cat-file -e "${ref}^{commit}"; then
              git fetch --no-tags --depth=1 origin "$ref"
            fi
          done
          export BALOOT_PREVIOUS_ROOT="$RUNNER_TEMP/oidc-previous"
          git worktree add --detach "$BALOOT_PREVIOUS_ROOT" "$BALOOT_TEST_OIDC_PRE_REGISTRY_REF"
          python -m pip install -c requirements-docker.txt 'psycopg[binary,pool]'
          python -m scripts.run_required_pytest \
            tests/oidc_postgres_integration.py::test_sqlite_oidc_storage_survives_release_roundtrip \
            tests/oidc_postgres_integration.py::test_sqlite_oidc_recovers_across_super_journal_commit \
            tests/oidc_postgres_integration.py::test_sqlite_oidc_rollback_keeps_configuration_and_registry_in_separate_custody \
            'tests/oidc_postgres_integration.py::test_oidc_migration_replay_is_atomic_and_preserves_data[current-main]' \
            'tests/oidc_postgres_integration.py::test_oidc_migration_replay_is_atomic_and_preserves_data[pre-receipt]' \
            'tests/oidc_postgres_integration.py::test_oidc_migration_replay_is_atomic_and_preserves_data[original-receipts]' \
            'tests/oidc_postgres_integration.py::test_oidc_migration_replay_is_atomic_and_preserves_data[corrected-pre-receipt]' \
            tests/oidc_postgres_integration.py::test_oidc_issuer_transition_on_postgres
      - name: Run isolated Python shard
        if: '!cancelled()'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$GITHUB_JOB" in
            python-fast-run) python -P scripts/run_isolated_pytest.py --workers 4 --shard "$SHARD" --output "$RUNNER_TEMP/python-receipts" ;;
            python-backend-run) python -P scripts/run_heavy_pytest.py run --versioned --workers 4 --shard "$SHARD" --output "$RUNNER_TEMP/python-receipts" ;;
            python-heavy) python -P scripts/run_heavy_pytest.py run --workers 4 --shard "$SHARD" --output "$RUNNER_TEMP/python-receipts" ;;
            *) exit 1 ;;
          esac
      - name: Record final fast shard status
        if: '!cancelled() && github.job == ''python-fast-run'''
        env:
          FAST_RESULT: ${{ job.status }}
          FAST_PYTHON: ${{ matrix.python }}
          FAST_SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP'], 'python-receipts')
          files = json.loads((path / 'results.json').read_text(encoding='utf-8'))
          (path / 'python-fast-status.json').write_text(json.dumps({
              'head': os.environ['GITHUB_SHA'], 'python': os.environ['FAST_PYTHON'],
              'result': os.environ['FAST_RESULT'], 'shard': int(os.environ['FAST_SHARD']),
              'files': sorted(row['file'] for row in files),
          }), encoding='utf-8')
          PY
      - name: Upload Python shard receipts and logs
        if: '!cancelled()'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.job }}-${{ matrix.python }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/python-receipts/
          if-no-files-found: error
          retention-days: 7

  python-affected:
    needs: [plan, native-build, ffmpeg-packages]
    if: needs.plan.outputs.tests != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: &affected-timeout 18
    env:
      BALOOT_PYTEST_JOB_MINUTES: *affected-timeout
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - *pytest-job-deadline
      - *checkout
      - *matrix-python
      - *node
      - *foundry-restore
      - *foundry-install
      - *remotion-restore
      - *remotion-install
      - *ffmpeg-download
      - *ffmpeg
      - *native-download
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}
      - run: python -m pip install -e '.[dev,grpc,security]'
      - env:
          AFFECTED_TESTS: ${{ needs.plan.outputs.tests }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.run_isolated_pytest import run
          raise SystemExit(run(json.loads(os.environ["AFFECTED_TESTS"]), Path(os.environ["RUNNER_TEMP"], "affected")))
          PY
      - if: '!cancelled()'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-affected-results-${{ matrix.python }}
          path: ${{ runner.temp }}/affected/
          if-no-files-found: error
          retention-days: 7

  python-backend-run:
    # Let the short producers clear capacity before the widest matrix starts.
    needs: [plan, python-wheelhouse, native-build, ffmpeg-packages, preflight, sdks, foundry, remotion-checks, native-sanitizers, python-windows, identity-postgres, postgres-configuration]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: &backend-timeout 30
    env:
      BALOOT_PYTEST_JOB_MINUTES: *backend-timeout
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        python: *full-python
        shard: [1, 2, 3, 4]
    steps: *python-shard

  python-heavy:
    needs: [plan, python-wheelhouse, native-build, ffmpeg-packages]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: &heavy-timeout 30
    env:
      BALOOT_PYTEST_JOB_MINUTES: *heavy-timeout
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: *full-python
        shard: [1, 2]
    steps: *python-shard

  python-coverage:
    needs: [plan, python-fast-run, python-backend-run, python-heavy]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - *checkout
      - *merge-group-base
      - *py313
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-{fast-run,backend-run,heavy}-*
          path: ${{ runner.temp }}/python-coverage
          digest-mismatch: error
      - run: python -P scripts/ci_scope.py coverage "$RUNNER_TEMP/python-coverage"

  media-inputs:
    needs: [plan, python-wheelhouse, ffmpeg-packages]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *py313
      - *ffmpeg-download
      - *ffmpeg
      - *python-runtime-download
      - *python-runtime-use
      - name: Verify governed font hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          fonts = Path("assets/fonts")
          for name, item in json.loads((fonts / "manifest.json").read_bytes())["fonts"].items():
              if hashlib.sha256((fonts / name).read_bytes()).hexdigest() != item["sha256"]:
                  raise ValueError(f"governed font hash differs: {name}")
          PY
      - env:
          SOURCE_DATE_EPOCH: '315532800'
        run: python -P scripts/generate_professional_video_prototypes.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-bundles
          path: outputs/professional-video-prototypes/
          if-no-files-found: error
          retention-days: 1

  remotion-checks:
    needs: plan
    if: needs.plan.outputs.remotion == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/baloot_platform/video/remotion
    steps:
      - *checkout
      - *node
      - *remotion-restore
      - *remotion-install
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.remotion-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *remotion-cache
      - run: npm run typecheck && npm test

  remotion-image-parity:
    needs: plan
    if: needs.plan.outputs.video_worker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: video-worker-build-cache
        with: &video-worker-build-cache
          path: ${{ runner.temp }}/video-worker-build-cache
          key: ${{ runner.os }}-video-worker-build-${{ hashFiles('Dockerfile', 'ci/Dockerfile.buildkit', '.dockerignore', 'pyproject.toml', 'requirements-docker.txt', 'src/baloot_platform/video/remotion/package*.json') }}
      - name: Build the video worker
        shell: bash
        env:
          CACHE_HIT: ${{ steps.video-worker-build-cache.outputs.cache-hit }}
          MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          read -r instruction buildkit_image extra < ci/Dockerfile.buildkit
          if [[ "$instruction" != FROM || -n "$extra" || ! "$buildkit_image" =~ ^moby/buildkit:[^@]+@sha256:[0-9a-f]{64}$ ]]; then
            echo 'ci/Dockerfile.buildkit must declare one digest-pinned BuildKit image' >&2
            exit 1
          fi
          docker buildx create --driver docker-container --driver-opt "image=$buildkit_image" --use
          cache_dir="$RUNNER_TEMP/video-worker-build-cache"
          cache_args=()
          if [[ "$CACHE_HIT" == 'true' ]]; then
            cache_args+=(--cache-from "type=local,src=$cache_dir")
          elif [[ "$MAIN_PUSH" == 'true' ]]; then
            cache_args+=(--cache-to "type=local,dest=$cache_dir,mode=min")
          fi
          docker buildx build --target video-worker --load --tag balootx-video-worker-parity "${cache_args[@]}" .
      - name: Check the runtime against the checkout lockfile
        run: |
          docker run --rm --network none --workdir /check \
            --mount "type=bind,source=$GITHUB_WORKSPACE/src/baloot_platform/video/remotion/package-lock.json,target=/check/package-lock.json,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/requirements-docker.txt,target=/check/requirements-docker.txt,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/remotion_image_parity.py,target=/check/scripts/remotion_image_parity.py,readonly" \
            balootx-video-worker-parity sh -ec '
              sha256sum --check --strict /opt/baloot-remotion/.lock-sha256
              cmp requirements-docker.txt /opt/baloot-build/requirements-docker.txt
              python -m pip list --format=freeze --exclude pip --exclude baloot-platform > /tmp/render-pip.txt
              if grep -Fixv -f requirements-docker.txt /tmp/render-pip.txt; then
                echo "Unexpected Python package versions in the worker" >&2
                exit 1
              else
                test "$?" -eq 1
              fi
              exec python -P scripts/remotion_image_parity.py /opt/baloot-remotion/node_modules package-lock.json
            '
      - name: Verify public producer preflight inside the video worker
        timeout-minutes: 2
        run: |
          source_head=$(git rev-parse HEAD)
          source_tree=$(git rev-parse 'HEAD^{tree}')
          image_id=$(docker image inspect --format '{{.Id}}' balootx-video-worker-parity)
          worker_checkout=$(mktemp -d "$RUNNER_TEMP/video-worker-checkout.XXXXXX")
          worker_inputs=$(mktemp -d "$RUNNER_TEMP/video-worker-receipts.XXXXXX")
          cp -a "$GITHUB_WORKSPACE/." "$worker_checkout/"
          python3 -B - "$worker_inputs" "$source_head" "$source_tree" "$image_id" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          from scripts.render_kickoff import new_verdict

          inputs, head, tree, image = sys.argv[1:]
          lock = Path("src/baloot_platform/video/remotion/package-lock.json")
          digest = hashlib.sha256(lock.read_bytes()).hexdigest()
          for name, source in (("valid", head), ("wrong", tree)):
              build = dict(status="PASSED", target="video-worker", sourceHead=source,
                           sourceTree=tree, imageId=image, packageLockSha256=digest)
              kickoff = new_verdict(source, tree, image)
              kickoff.update(status="passed", mainHead=head, checkedAt="2026-01-01T00:00:00Z",
                             packageLockSha256=digest)
              (Path(inputs) / f"{name}-build.json").write_text(json.dumps(build), encoding="utf-8")
              (Path(inputs) / f"{name}-kickoff.json").write_text(json.dumps(kickoff), encoding="utf-8")
          PY
          sudo chown -R 10001 "$worker_checkout" "$worker_inputs"
          docker run --rm --network none --read-only --workdir /checkout -i \
            --mount "type=bind,source=$worker_checkout,target=/checkout,readonly" \
            --mount "type=bind,source=$worker_inputs,target=/receipts,readonly" \
            --env PYTHONPATH=/checkout/src --env BALOOT_ROOT=/checkout \
            --env "BALOOT_RENDER_IMAGE_ID=$image_id" \
            balootx-video-worker-parity sh -ec '
              test "$(id -u)" -eq 10001
              exec python -B - "$@"
            ' worker "$source_head" "$source_tree" <<'PY'
          from datetime import UTC, datetime
          import os
          import subprocess
          import sys
          from unittest.mock import patch

          from baloot_platform.video.remotion_renderer import WORKER_RENDERER_ROOT
          from scripts import render_kickoff, render_research_notice as notice

          class PreflightPassed(Exception):
              pass

          def run_producer(case, head, tree):
              with patch.dict(os.environ, {
                  "BALOOT_RENDER_BUILD_RECEIPT": f"/receipts/{case}-build.json",
                  "BALOOT_RENDER_KICKOFF_RECEIPT": f"/receipts/{case}-kickoff.json",
              }):
                  notice.main(source_head=head, source_tree=tree)

          source_head, source_tree = sys.argv[1:]
          checkout_renderer = notice.STYLE.parents[1]
          assert not (checkout_renderer / "node_modules").exists()
          for asset in ("scripts/ffmpeg-runtime.json", "src/style.css", "src/playback-timing.mjs"):
              assert (WORKER_RENDERER_ROOT / asset).read_bytes() == (checkout_renderer / asset).read_bytes(), asset
          with (
              patch.object(render_kickoff, "utc_now", return_value=datetime(2026, 1, 1, tzinfo=UTC)),
              patch.object(notice, "build_notice_bundle", side_effect=PreflightPassed),
          ):
              try:
                  run_producer("valid", source_head, source_tree)
              except PreflightPassed:
                  pass
              else:
                  raise SystemExit("public producer did not reach bundle generation")
              try:
                  run_producer("wrong", source_tree, source_tree)
              except ValueError as exc:
                  if "does not match the pinned source" not in str(exc):
                      raise
              else:
                  raise SystemExit("public producer accepted the wrong source commit")
          subprocess.run(
              ["node", "--input-type=module", "-e",
               "import '@remotion/bundler'; import '@remotion/renderer'; "
               "import './scripts/ffmpeg-profile.mjs'; import './src/playback-timing.mjs';"],
              cwd=WORKER_RENDERER_ROOT, check=True,
          )
          PY
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.video-worker-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *video-worker-build-cache

  media-render:
    needs: [plan, media-inputs, remotion-image-parity]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [flagship, decision, companion, parity]
    defaults:
      run:
        working-directory: src/baloot_platform/video/remotion
    env:
      SOURCE_DATE_EPOCH: '315532800'
      BALOOT_RENDER_TIMEOUT_SECONDS: '1200'
      OMP_NUM_THREADS: '4'
    steps:
      - *checkout
      - *py313
      - *node
      - *remotion-restore
      - *remotion-install
      - *ffmpeg-download
      - *ffmpeg
      - *python-runtime-download
      - *python-runtime-use
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: media-bundles
          path: outputs/professional-video-prototypes
          digest-mismatch: error
      - name: Check synthetic hook layouts
        if: matrix.shard == 'decision'
        run: >-
          node tests/hook-layout.integration.mjs ../../../../outputs/professional-video-prototypes/render-bundle-decision.json "$HOOK_FRAMES_DIR"
        env:
          HOOK_FRAMES_DIR: ${{ runner.temp }}/notice-on-hook-frames
      - name: Render the governed media shard
        working-directory: .
        env:
          SHARD: ${{ matrix.shard }}
          BALOOT_RENDER_EVIDENCE_DIR: ${{ runner.temp }}/media-stage-logs
        run: |
          cpus="$(python -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:4])))')"
          taskset --cpu-list "$cpus" sh -ec '
            test "$(nproc)" -le 4
            python -P scripts/render_release.py --ci-shard "$SHARD"
            if [ "$SHARD" = companion ]; then
              mv "$RUNNER_TEMP/media-shard.tar" "$RUNNER_TEMP/media-shard-first.tar"
              BALOOT_RENDER_EVIDENCE_DIR="$BALOOT_RENDER_EVIDENCE_DIR/repeat" \
                python -P scripts/render_release.py --ci-shard "$SHARD"
              cmp "$RUNNER_TEMP/media-shard-first.tar" "$RUNNER_TEMP/media-shard.tar"
              sha256sum "$RUNNER_TEMP/media-shard.tar"
            fi
          '
      - name: Upload shard media
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-render-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/media-shard.tar
            ${{ matrix.shard == 'decision' && github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}/notice-on-hook-frames/*.png', runner.temp) || '' }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Check synthetic transition layouts
        if: matrix.shard == 'decision'
        working-directory: .
        run: |
          bundle="$RUNNER_TEMP/transition-layout-bundle.json"
          PYTHONPATH="$PWD:$PWD/src" python -P - "$bundle" <<'PY'
          import json
          from pathlib import Path
          import sys

          from baloot_platform.core.rules import RuleBook
          from scripts import render_research_notice as notice
          from scripts.nightly_candidates import synthetic_identity

          rules = RuleBook.load(notice.ROOT / "configs/rules/saudi_common_v1.yaml")
          profile = notice.notice_profile()
          profile["identity"] = synthetic_identity()
          bundle = notice.build_notice_bundle(rules, profile)
          notice.validate_notice_bundle(bundle, notice.engine_round_result(rules))
          Path(sys.argv[1]).write_text(json.dumps(bundle.to_dict(), ensure_ascii=False), encoding="utf-8")
          PY
          cd src/baloot_platform/video/remotion
          node tests/transition-layout.integration.mjs "$bundle" "$RUNNER_TEMP/media-stage-logs/transition-layout"
      - name: Retain render stage logs
        if: '!cancelled()'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-stage-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/media-stage-logs/
          if-no-files-found: ignore
          retention-days: 7

  media-release-smoke:
    needs: [plan, media-render]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_DATE_EPOCH: '315532800'
    steps:
      - *checkout
      - *py313
      - *ffmpeg-download
      - *ffmpeg
      - *python-runtime-download
      - *python-runtime-use
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: media-render-*
          path: ${{ runner.temp }}/media-shards
          digest-mismatch: error
      - run: |
          for shard in flagship decision companion parity; do
            tar -xf "$RUNNER_TEMP/media-shards/media-render-$shard/media-shard.tar"
          done
          mv outputs/professional-video-collection/trick-collection-sample.mp4 outputs/professional-video-flagship/
          python -P scripts/verify_remotion_plugin_parity.py
          python -P scripts/generate_scene_preview.py --refresh
          python -P - outputs/professional-video-{flagship/balootx-complete-laffah-audit,flagship/trick-collection-sample,decision/balootx-decision-clip}.mp4 <<'PY'
          import sys
          from baloot_platform.video.media_probe import run_media_command

          for video in sys.argv[1:]:
              run_media_command(["ffmpeg", "-v", "error", "-xerror", "-i", video, "-f", "null", "-"], check=True)
          PY
          python -P scripts/generate_media_probe.py
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -P scripts/generate_test_inventory_v20.py --version "$version" --output release/test-inventory.json
          python -P scripts/generate_supply_chain.py --sbom-output release/sbom.cdx.json --license-output release/license-inventory.json
          python -P scripts/generate_platform_evidence.py

  viewer-seat-proof:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.viewer-seat-proof && (!inputs.qa-journey || inputs.qa-journey == 'none') }}
    uses: ./.github/workflows/viewer-seat-proof.yml

  qa-journey:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qa-journey && inputs.qa-journey != 'none' }}
    name: QA journey (${{ inputs.qa-journey }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      QA_JOURNEY: ${{ inputs.qa-journey }}
    steps:
      - name: Validate the dispatch choice
        shell: python
        env:
          VIEWER_SEAT_PROOF: ${{ inputs.viewer-seat-proof }}
        run: |
          import os

          if os.environ['QA_JOURNEY'] not in ('foundry', 'api-sdk', 'replay-adjudication', 'clip-render-bundle'):
              raise SystemExit('Select a declared QA journey.')
          if os.environ['VIEWER_SEAT_PROOF'] != 'false':
              raise SystemExit('Turn off viewer-seat-proof when dispatching a QA journey.')
      - *checkout
      - *foundry-playwright-output
      - name: Bind evidence to the dispatched source
        id: source
        env:
          BALOOT_OPERATOR_E2E_OUTPUT_DIR: ${{ steps.playwright-output.outputs.path }}
        run: |
          head=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          test "$head" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/qa-journey"
          printf 'journey=%s\nhead=%s\ntree=%s\n' "$QA_JOURNEY" "$head" "$tree" > "$RUNNER_TEMP/qa-journey/source.txt"
          printf 'foundry-screenshots=%s/*/alternate-first-result-*.png\n' "$BALOOT_OPERATOR_E2E_OUTPUT_DIR" >> "$GITHUB_OUTPUT"
      - *py313
      - run: python -m pip install -e '.[dev,grpc,security]'
      - name: Run selected Python checks
        run: |
          case "$QA_JOURNEY" in
            foundry)
              nodes=(tests/test_research_foundry.py::test_research_auction_is_compiled_and_replayed_without_buyer_assumption) ;;
            api-sdk)
              nodes=(
                tests/test_research_foundry.py::test_research_api_is_connected_to_the_governed_runtime
                tests/test_v2_research_sdk_contracts.py::test_python_sdk_recipe_mutations_and_pagination_preserve_compatibility
                tests/test_research_operator_audit_sdk_contracts.py::test_python_sdk_retrieves_the_typed_operator_audit
              ) ;;
            replay-adjudication)
              nodes=(
                tests/test_v6_replay_audit_difficulty_video.py::test_replay_audit_separates_effect_from_human_intent
                tests/test_adjudication_research_boundary_v1.py::test_adjudication_event_evidence_is_deterministic_and_observer_safe
                tests/test_observer_information_projection.py::test_projection_contains_governed_public_state_without_hidden_cards
              ) ;;
            clip-render-bundle)
              nodes=(
                tests/test_render_bundle.py::test_render_bundle_is_deterministic_observer_safe_and_self_verifying
                tests/test_render_bundle.py::test_render_bundle_rejects_mixed_private_perspectives
                'tests/test_render_bundle.py::test_public_notice_identity_and_five_visible_voice_phrases[voice-off-profile]'
              ) ;;
            *) exit 1 ;;
          esac
          python -m scripts.run_required_pytest "${nodes[@]}" 2>&1 | tee "$RUNNER_TEMP/qa-journey/pytest.log"
      - *node
      - name: Check TypeScript SDK
        if: inputs.qa-journey == 'api-sdk'
        run: |
          npx --yes --package typescript@5.8.3 tsc -p sdk/typescript/tsconfig.json --noEmit 2>&1 | tee "$RUNNER_TEMP/qa-journey/typescript.log"
      - if: inputs.qa-journey == 'api-sdk'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.23'
          cache: false
      - name: Exercise Go SDK
        if: inputs.qa-journey == 'api-sdk'
        run: |
          (cd sdk/go && go test -count=1 -json ./...) | tee "$RUNNER_TEMP/qa-journey/go.jsonl"
          python -P scripts/verify_qa_journey.py go "$RUNNER_TEMP/qa-journey/go.jsonl"
      - name: Exercise Foundry authoring and research on desktop and mobile
        if: inputs.qa-journey == 'foundry'
        id: foundry-journey
        working-directory: src/baloot_platform/service/foundry_dashboard
        env:
          BALOOT_FOUNDRY_QA_JOURNEY: '1'
          BALOOT_OPERATOR_E2E_FOUNDRY_DIR: ${{ runner.temp }}/foundry-dashboard
          BALOOT_OPERATOR_E2E_OUTPUT_DIR: ${{ steps.playwright-output.outputs.path }}
          BALOOT_REUSE_OPERATOR_E2E_SERVER: '0'
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ runner.temp }}/qa-journey/foundry.xml
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build -- --outDir "$BALOOT_OPERATOR_E2E_FOUNDRY_DIR"
          ./node_modules/.bin/playwright install --with-deps chromium
          npm run test:operator-e2e -- foundry_ortools_operator.spec.ts \
            --grep 'the disclosed target-wins-trick-6 alternative diagnoses its first result$' \
            --project=desktop-chrome --project=mobile-touch-chrome --workers=1 \
            --reporter=list,junit
      - name: Verify Foundry journey evidence
        if: inputs.qa-journey == 'foundry'
        env:
          FOUNDRY_JOURNEY_SCREENSHOTS: ${{ steps.source.outputs.foundry-screenshots }}
        run: python -P scripts/verify_qa_journey.py foundry "$RUNNER_TEMP/qa-journey/foundry.xml" "$FOUNDRY_JOURNEY_SCREENSHOTS"
      - name: Upload QA journey results
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-journey-${{ inputs.qa-journey }}-results
          path: ${{ runner.temp }}/qa-journey/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Foundry journey screenshots
        if: ${{ !cancelled() && inputs.qa-journey == 'foundry' && steps.foundry-journey.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-journey-foundry-screenshots
          path: ${{ steps.source.outputs.foundry-screenshots }}
          if-no-files-found: error
          retention-days: 7

  commit-screen:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/commit-screen.yml

  ci-gate:
    name: ${{ github.event_name == 'workflow_dispatch' && 'CI diagnostic result' || 'ci-gate' }}
    needs: [plan, preflight, commit-screen, dependency-review, python-version-smoke, docker-constraints, identity-postgres, postgres-configuration, foundry, sdks, python-affected, python-wheelhouse, ffmpeg-packages, native-build, native-sanitizers, python-windows, python-fast-run, python-backend-run, python-heavy, python-coverage, media-inputs, remotion-checks, remotion-image-parity, media-render, media-release-smoke]
    if: ${{ always() && !inputs.viewer-seat-proof && (!inputs.qa-journey || inputs.qa-journey == 'none') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require an independent verdict on critical changes
        if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'merge_group'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            if ! REVIEW_BASE=$(git rev-parse --verify 'HEAD^1^{commit}'); then
              echo '::error::PR merge base is missing from the checkout. Update the PR branch to start a fresh CI run.'
              exit 1
            fi
          fi
          [[ "$REVIEW_BASE" =~ ^[0-9a-f]{40}$ ]]
          base_files=$(git ls-tree --name-only "$REVIEW_BASE" -- ci/critical_review.py ci/critical-paths.json)
          test "$base_files" = $'ci/critical-paths.json\nci/critical_review.py'
          git show "$REVIEW_BASE:ci/critical_review.py" > "$RUNNER_TEMP/critical-review.py"
          python3 -I "$RUNNER_TEMP/critical-review.py"
      - env:
          CI_RESULTS: ${{ toJSON(needs) }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          if [[ "$IS_DRAFT" == true ]]; then
            echo '::error::Draft PR. Mark ready for review to run CI.'
            exit 1
          fi
          python3 -P scripts/ci_scope.py gate
