name: ci

on:
  workflow_dispatch:
    inputs:
      viewer-seat-proof:
        description: Run the viewer-seat proof cohort
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name != 'pull_request' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_RETRIES: '2'
  PIP_TIMEOUT: '30'
  NPM_CONFIG_FETCH_RETRIES: '2'
  NPM_CONFIG_FETCH_TIMEOUT: '40000'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'
  PYTHONPATH: src

jobs:
  plan:
    if: ${{ !inputs.viewer-seat-proof && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      sdk: ${{ steps.plan.outputs.sdk }}
      foundry: ${{ steps.plan.outputs.foundry }}
      remotion: ${{ steps.plan.outputs.remotion }}
      tests: ${{ steps.plan.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: plan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 -P scripts/ci_scope.py plan

  preflight:
    if: ${{ !inputs.viewer-seat-proof }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &py313
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest>=8.3' 'PyYAML>=6.0' 'ruff>=0.11'
      - run: |
          ruff check --select E9,F63,F7,F82 src scripts sdk/python tests
          python -m compileall -q src scripts sdk/python
          python -m pytest -q tests/test_ci_hosted_contract.py tests/test_repository_structure.py tests/test_media_render_artifact.py

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - *checkout
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

  python-version-smoke:
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: |
          python -m pip install '.[dev,grpc,security]'
          python -m compileall -q src scripts sdk/python
          python -m pytest -q tests/test_mcp_builtin.py

  foundry:
    needs: [plan, python-wheelhouse]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.foundry == 'true' &&
      (needs.python-wheelhouse.result == 'success' ||
       (needs.plan.outputs.full == 'false' && needs.python-wheelhouse.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/baloot_platform/service/foundry_dashboard
    steps:
      - *checkout
      - *py313
      - &python-runtime-download
        if: needs.plan.outputs.full == 'true'
        uses: &download-artifact actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-runtime-3.13
          path: ${{ runner.temp }}
          digest-mismatch: error
      - &python-runtime-use
        if: needs.plan.outputs.full == 'true'
        name: Activate installed Python runtime
        run: |
          base="$(python -P -c 'import sys; print(sys.base_prefix)')"
          tar -xzf "$RUNNER_TEMP/python-runtime.tar.gz" -C "$RUNNER_TEMP"
          runtime="$RUNNER_TEMP/ci-venv"
          test "$("$runtime/bin/python" -P -c 'import sys; print(sys.base_prefix)')" = "$base"
          test "$("$runtime/bin/python" -P -c 'import sys; print(sys.prefix)')" = "$runtime"
          printf '%s\n' "$runtime/bin" >> "$GITHUB_PATH"
          printf 'VIRTUAL_ENV=%s\n' "$runtime" >> "$GITHUB_ENV"
      - if: needs.plan.outputs.full == 'false'
        working-directory: .
        run: python -m pip install -e '.[dev,grpc,security]'
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - &foundry-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: foundry-cache
        with: &foundry-cache
          path: ~/.npm
          key: ${{ runner.os }}-node22-foundry-${{ hashFiles('src/baloot_platform/service/foundry_dashboard/package-lock.json') }}
      - &foundry-install
        working-directory: src/baloot_platform/service/foundry_dashboard
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.foundry-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *foundry-cache
      - &remotion-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: remotion-cache
        with: &remotion-cache
          path: ~/.npm
          key: ${{ runner.os }}-node22-remotion-${{ hashFiles('src/baloot_platform/video/remotion/package-lock.json') }}
      - &remotion-install
        working-directory: src/baloot_platform/video/remotion
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run test:research

  sdks:
    needs: plan
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - *checkout
      - *node
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.23'
          cache: false
      - run: npx --yes --package typescript@5.8.3 tsc -p sdk/typescript/tsconfig.json --noEmit
      - run: go test ./...
        working-directory: sdk/go

  python-wheelhouse:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: &full-python ${{ fromJSON(github.event_name == 'pull_request' && '["3.13"]' || '["3.12","3.13"]') }}
    steps:
      - *checkout
      - &matrix-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with: &pip-cache
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}
      - name: Build wheels and install the run-local Python runtime
        shell: bash
        run: |
          python -P -m pip wheel --wheel-dir "$RUNNER_TEMP/wheelhouse" '.[dev,grpc,security]'
          python -P -m venv "$RUNNER_TEMP/ci-venv"
          # Setuptools leaves source metadata on PYTHONPATH during the wheel build.
          "$RUNNER_TEMP/ci-venv/bin/python" -I -m pip install --no-index "$RUNNER_TEMP"/wheelhouse/*.whl
          "$RUNNER_TEMP/ci-venv/bin/python" -I -c 'from importlib.metadata import version; print(version("baloot-platform"))'
          tar -C "$RUNNER_TEMP" -cf - ci-venv | gzip -1 > "$RUNNER_TEMP/python-runtime.tar.gz"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *pip-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-runtime-${{ matrix.python }}
          path: ${{ runner.temp }}/python-runtime.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  ffmpeg-packages:
    needs: plan
    if: needs.plan.outputs.full == 'true' || needs.plan.outputs.tests != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - *checkout
      - id: ffmpeg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &ffmpeg-cache
          path: ${{ runner.temp }}/ffmpeg-debs
          key: ${{ runner.os }}-${{ runner.arch }}-ffmpeg-6.1.1-3ubuntu5-${{ hashFiles('.github/ffmpeg/noble-amd64.sha256') }}
      - name: Fetch pinned FFmpeg packages
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg-debs"
          cd "$RUNNER_TEMP/ffmpeg-debs"
          xargs -r -P 4 -n 2 bash -euo pipefail -c '
            mkdir -p "$(dirname "$2")"
            curl --fail --silent --show-error --location --retry 2 --retry-all-errors \
              --retry-delay 1 --connect-timeout 5 --max-time 25 --output "$2" \
              "https://snapshot.ubuntu.com/ubuntu/20261120T000000Z/$2" || exit 255
            printf "%s  %s\n" "$1" "$2" | sha256sum --check --strict || exit 255
          ' bash < "$GITHUB_WORKSPACE/.github/ffmpeg/noble-amd64.sha256"
      - name: Verify pinned FFmpeg cache
        if: steps.ffmpeg-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          cd "$RUNNER_TEMP/ffmpeg-debs"
          sha256sum --check --strict "$GITHUB_WORKSPACE/.github/ffmpeg/noble-amd64.sha256"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *ffmpeg-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-debs-6.1.1-3ubuntu5
          path: ${{ runner.temp }}/ffmpeg-debs
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  native-build:
    needs: plan
    if: needs.plan.outputs.full == 'true' || needs.plan.outputs.tests != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - name: Fingerprint the native toolchain
        id: toolchain
        run: |
          identity="$( { cmake --version; ninja --version; c++ --version; ldd --version; cat /etc/os-release; printf '%s\n' "$GITHUB_WORKSPACE"; } | sha256sum | cut -d ' ' -f 1)"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with: &native-cache
          path: build/native-release
          key: ${{ runner.os }}-${{ runner.arch }}-native-release-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('native/**') }}
      - run: |
          cmake -S native -B build/native-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-release
          ctest --test-dir build/native-release --output-on-failure
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *native-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-release-library
          path: build/native-release/libbaloot_native.so
          if-no-files-found: error
          retention-days: 1

  native-sanitizers:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address
            extra: ''
          - sanitizer: undefined
            extra: -fno-sanitize-recover=all
    steps:
      - *checkout
      - env:
          SANITIZER: ${{ matrix.sanitizer }}
          EXTRA: ${{ matrix.extra }}
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          asan='detect_leaks=1:halt_on_error=1:abort_on_error=1:disable_coredump=1'
          cmake -S native -B build/sanitizer -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_CXX_FLAGS=-fsanitize=$SANITIZER -fno-omit-frame-pointer $EXTRA" \
            "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=$SANITIZER" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=$SANITIZER" \
            "-DBALOOT_ASAN_OPTIONS=$asan"
          cmake --build build/sanitizer
          env -u LD_PRELOAD -u ASAN_OPTIONS timeout 180s \
            ctest --test-dir build/sanitizer --output-on-failure --timeout 150
          if [[ "$SANITIZER" == address ]]; then
            env -u LD_PRELOAD ASAN_OPTIONS="$asan" timeout 150s build/sanitizer/baloot_native_tests
          fi

  python-fast-run:
    needs: [plan, python-wheelhouse, native-build, ffmpeg-packages]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: *full-python
        shard: [1, 2, 3]
    steps: &python-shard
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - *matrix-python
      - *node
      - if: github.job == 'python-fast-run'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *foundry-cache
      - if: github.job == 'python-fast-run'
        working-directory: src/baloot_platform/service/foundry_dashboard
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: github.job == 'python-fast-run'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *remotion-cache
      - if: github.job == 'python-fast-run'
        working-directory: src/baloot_platform/video/remotion
        run: npm ci --ignore-scripts --no-audit --no-fund
      - &ffmpeg-download
        name: Download verified FFmpeg packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-debs-6.1.1-3ubuntu5
          path: ${{ runner.temp }}/ffmpeg-debs
          digest-mismatch: error
      - &ffmpeg
        name: Install pinned FFmpeg
        shell: bash
        run: |
          cd "$RUNNER_TEMP/ffmpeg-debs"
          manifest="$GITHUB_WORKSPACE/.github/ffmpeg/noble-amd64.sha256"
          sha256sum --check --strict "$manifest"
          mapfile -t packages < <(awk '{print "./" $2}' "$manifest")
          sudo env DEBIAN_FRONTEND=noninteractive dpkg --skip-same-version --install "${packages[@]}"
          ffmpeg -version
          ffprobe -version
      - uses: *download-artifact
        with:
          name: python-runtime-${{ matrix.python }}
          path: ${{ runner.temp }}
          digest-mismatch: error
      - *python-runtime-use
      - &native-download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-release-library
          path: build/native-release
          digest-mismatch: error
      - name: Check generated contracts
        if: matrix.shard == 1 && github.job == 'python-fast-run'
        run: |
          python -P scripts/sync_package_resources.py
          python -P scripts/generate_openapi.py
          git diff --exit-code -- api/openapi.json
      - name: Run isolated Python shard
        if: '!cancelled()'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$GITHUB_JOB" in
            python-fast-run) python -P scripts/run_isolated_pytest.py --workers 4 --shard "$SHARD" --output "$RUNNER_TEMP/python-receipts" ;;
            python-backend-run) python -P scripts/run_heavy_pytest.py run --versioned --workers 4 --shard "$SHARD" --output "$RUNNER_TEMP/python-receipts" ;;
            python-heavy) python -P scripts/run_heavy_pytest.py run --workers 4 --shard "$SHARD" --output "$RUNNER_TEMP/python-receipts" ;;
            *) exit 1 ;;
          esac
      - name: Record final fast shard status
        if: '!cancelled() && github.job == ''python-fast-run'''
        env:
          FAST_RESULT: ${{ job.status }}
          FAST_PYTHON: ${{ matrix.python }}
          FAST_SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP'], 'python-receipts')
          files = json.loads((path / 'results.json').read_text(encoding='utf-8'))
          (path / 'python-fast-status.json').write_text(json.dumps({
              'head': os.environ['GITHUB_SHA'], 'python': os.environ['FAST_PYTHON'],
              'result': os.environ['FAST_RESULT'], 'shard': int(os.environ['FAST_SHARD']),
              'files': sorted(row['file'] for row in files),
          }), encoding='utf-8')
          PY
      - name: Upload Python shard receipts and logs
        if: '!cancelled()'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.job }}-${{ matrix.python }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/python-receipts/
          if-no-files-found: error
          retention-days: 7

  python-affected:
    needs: [plan, native-build, ffmpeg-packages]
    if: needs.plan.outputs.tests != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - *checkout
      - *matrix-python
      - *node
      - *foundry-restore
      - *foundry-install
      - *remotion-restore
      - *remotion-install
      - *ffmpeg-download
      - *ffmpeg
      - *native-download
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}
      - run: python -m pip install -e '.[dev,grpc,security]'
      - env:
          AFFECTED_TESTS: ${{ needs.plan.outputs.tests }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.run_isolated_pytest import run
          raise SystemExit(run(json.loads(os.environ["AFFECTED_TESTS"]), Path(os.environ["RUNNER_TEMP"], "affected")))
          PY
      - if: '!cancelled()'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-affected-results-${{ matrix.python }}
          path: ${{ runner.temp }}/affected/
          if-no-files-found: error
          retention-days: 7

  python-backend-run:
    # Let the short producers clear capacity before the widest matrix starts.
    needs: [plan, python-wheelhouse, native-build, ffmpeg-packages, preflight, sdks, foundry, remotion-checks, native-sanitizers]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: *full-python
        shard: [1, 2, 3, 4]
    steps: *python-shard

  python-heavy:
    needs: [plan, python-wheelhouse, native-build, ffmpeg-packages]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13']
        shard: [1, 2]
    steps: *python-shard

  python-coverage:
    needs: [plan, python-fast-run, python-backend-run, python-heavy]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - *checkout
      - *py313
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-{fast-run,backend-run,heavy}-*
          path: ${{ runner.temp }}/python-coverage
          digest-mismatch: error
      - run: python -P scripts/ci_scope.py coverage "$RUNNER_TEMP/python-coverage"

  media-inputs:
    needs: [plan, python-wheelhouse, ffmpeg-packages]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *py313
      - *ffmpeg-download
      - *ffmpeg
      - *python-runtime-download
      - *python-runtime-use
      - name: Verify governed font hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          fonts = Path("assets/fonts")
          for name, item in json.loads((fonts / "manifest.json").read_bytes())["fonts"].items():
              if hashlib.sha256((fonts / name).read_bytes()).hexdigest() != item["sha256"]:
                  raise ValueError(f"governed font hash differs: {name}")
          PY
      - env:
          SOURCE_DATE_EPOCH: '315532800'
        run: python -P scripts/generate_professional_video_prototypes.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-bundles
          path: outputs/professional-video-prototypes/
          if-no-files-found: error
          retention-days: 1

  remotion-checks:
    needs: plan
    if: needs.plan.outputs.remotion == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/baloot_platform/video/remotion
    steps:
      - *checkout
      - *node
      - *remotion-restore
      - *remotion-install
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.remotion-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *remotion-cache
      - run: npm run typecheck && npm test

  media-render:
    needs: [plan, media-inputs]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [flagship, decision, companion, parity]
    defaults:
      run:
        working-directory: src/baloot_platform/video/remotion
    env:
      SOURCE_DATE_EPOCH: '315532800'
      BALOOT_RENDER_TIMEOUT_SECONDS: '1200'
      OMP_NUM_THREADS: '4'
    steps:
      - *checkout
      - *py313
      - *node
      - *remotion-restore
      - *remotion-install
      - *ffmpeg-download
      - *ffmpeg
      - *python-runtime-download
      - *python-runtime-use
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: media-bundles
          path: outputs/professional-video-prototypes
          digest-mismatch: error
      - name: Render the governed media shard
        working-directory: .
        env:
          SHARD: ${{ matrix.shard }}
          BALOOT_RENDER_EVIDENCE_DIR: ${{ runner.temp }}/media-stage-logs
        run: |
          cpus="$(python -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:4])))')"
          taskset --cpu-list "$cpus" sh -ec '
            test "$(nproc)" -le 4
            python -P scripts/render_release.py --ci-shard "$SHARD"
            if [ "$SHARD" = companion ]; then
              mv "$RUNNER_TEMP/media-shard.tar" "$RUNNER_TEMP/media-shard-first.tar"
              BALOOT_RENDER_EVIDENCE_DIR="$BALOOT_RENDER_EVIDENCE_DIR/repeat" \
                python -P scripts/render_release.py --ci-shard "$SHARD"
              cmp "$RUNNER_TEMP/media-shard-first.tar" "$RUNNER_TEMP/media-shard.tar"
              sha256sum "$RUNNER_TEMP/media-shard.tar"
            fi
          '
      - name: Upload shard media
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-render-${{ matrix.shard }}
          path: ${{ runner.temp }}/media-shard.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Retain render stage logs
        if: '!cancelled()'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-stage-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/media-stage-logs/
          if-no-files-found: ignore
          retention-days: 7

  media-release-smoke:
    needs: [plan, media-render]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_DATE_EPOCH: '315532800'
    steps:
      - *checkout
      - *py313
      - *ffmpeg-download
      - *ffmpeg
      - *python-runtime-download
      - *python-runtime-use
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: media-render-*
          path: ${{ runner.temp }}/media-shards
          digest-mismatch: error
      - run: |
          for shard in flagship decision companion parity; do
            tar -xf "$RUNNER_TEMP/media-shards/media-render-$shard/media-shard.tar"
          done
          mv outputs/professional-video-collection/trick-collection-sample.mp4 outputs/professional-video-flagship/
          python -P scripts/verify_remotion_plugin_parity.py
          python -P scripts/generate_scene_preview.py --refresh
          for video in outputs/professional-video-{flagship/balootx-complete-laffah-audit,decision/balootx-decision-clip}.mp4; do
            ffmpeg -v error -xerror -threads 4 -i "$video" -filter_threads 4 -filter_complex_threads 4 -threads 4 -f null -
          done
          python -P scripts/generate_media_probe.py
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -P scripts/generate_test_inventory_v20.py --version "$version" --output release/test-inventory.json
          python -P scripts/generate_supply_chain.py --sbom-output release/sbom.cdx.json --license-output release/license-inventory.json
          python -P scripts/generate_platform_evidence.py

  viewer-seat-proof:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.viewer-seat-proof }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - clip: '16-05'
            sha256: a2e1a514eecab50d5d5caa434297292a41fff016f297217b2095582257d04a5d
          - clip: '19-03'
            sha256: a9ee58ac29ccd1e98f3cbc1403ec5db53c65fc51c707928f37e0e986bdc8c9a3
          - clip: '18-03'
            sha256: dd07b0f7101c043fbcbf1b987d2991cce68c3d40cf5820c29c21753eafce4b38
    steps:
      - *checkout
      - *py313
      - run: python -m pip install .
      - name: Build the native exact solver
        run: |
          cmake -S native -B build/native-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-release --target baloot_native
      - name: Prove the viewer-seat deal cohort
        id: proof
        env:
          CLIP: ${{ matrix.clip }}
          FIXTURE_SHA256: ${{ matrix.sha256 }}
          PYTHONUTF8: '1'
        run: |
          python -P scripts/viewer_seat_proof.py \
            --fixture "examples/research-scenario-v4-single-winner-202611${CLIP}.json" \
            --fixture-sha256 "$FIXTURE_SHA256" --out "viewer-seat-${CLIP}.json" \
            --backend native --native-library build/native-release/libbaloot_native.so
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.proof.outcome != 'skipped' }}
        with:
          name: viewer-seat-${{ matrix.clip }}
          path: viewer-seat-${{ matrix.clip }}.json
          if-no-files-found: error
          retention-days: 30

  ci-gate:
    name: ${{ github.event_name == 'workflow_dispatch' && 'CI diagnostic result' || 'CI result' }}
    needs: [plan, preflight, dependency-review, python-version-smoke, foundry, sdks, python-affected, python-wheelhouse, ffmpeg-packages, native-build, native-sanitizers, python-fast-run, python-backend-run, python-heavy, python-coverage, media-inputs, remotion-checks, media-render, media-release-smoke]
    if: ${{ always() && !inputs.viewer-seat-proof }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - *checkout
      - env:
          CI_RESULTS: ${{ toJSON(needs) }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          if [[ "$IS_DRAFT" == true ]]; then
            echo '::error::Draft PR. Mark ready for review to run CI.'
            exit 1
          fi
          python3 -P scripts/ci_scope.py gate
